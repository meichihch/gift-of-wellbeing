<style>
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{margin:0;background:#E3E8E2;color:#0F2418;font-family:'Outfit','Noto Sans TC','PingFang TC',sans-serif}
  button,input{font-family:inherit}
  @keyframes th-pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
  @keyframes th-drift{0%{transform:translateX(-5%)}50%{transform:translateX(5%)}100%{transform:translateX(-5%)}}
  @keyframes th-dots{0%,100%{opacity:.2}50%{opacity:.95}}
  @keyframes th-draw{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}
  @keyframes th-breathe{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.035) rotate(1.2deg)}}
  @keyframes th-glow{0%,100%{opacity:.7}50%{opacity:1}}
  /* 地上的光圈跟呼吸練習同一個節奏：吸氣 4 秒、停 2 秒、吐氣 6 秒，一輪 12 秒 */
  @keyframes th-ring{0%,100%{transform:translateX(-50%) scale(.9);opacity:.55}33%,50%{transform:translateX(-50%) scale(1.08);opacity:1}}
  @keyframes th-ripple{0%,50%{transform:translateX(-50%) scale(1.04);opacity:0}54%{opacity:.5}100%{transform:translateX(-50%) scale(1.65);opacity:0}}
  @keyframes th-halo{0%,100%{transform:translate(-50%,-50%) scale(.92);opacity:.6}33%,50%{transform:translate(-50%,-50%) scale(1.06);opacity:1}}
  @keyframes th-sway{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}
  @keyframes th-swayv{0%,100%{transform:rotate(calc(var(--sway,0deg) * -1))}50%{transform:rotate(var(--sway,0deg))}}
  /* 樹上的名牌：跟呼吸同一個節奏輕輕放大、變亮 */
  @keyframes th-tag{0%,100%{transform:translateX(-50%) scale(.95);opacity:.7}33%,50%{transform:translateX(-50%) scale(1.04);opacity:1}}
  @keyframes th-dot{0%,100%{transform:translate(-50%,50%) scale(.8);opacity:.5}33%,50%{transform:translate(-50%,50%) scale(1.3);opacity:1}}
  /* 系統開了「減少動態效果」就停掉動畫；網址加 ?motion=1（調校頁會加）可以強制打開 */
  @media (prefers-reduced-motion: reduce){html:not([data-motion]) *{animation:none!important;transition:none!important}}
  #app input::placeholder{color:rgba(242,246,240,.42)}
  #app *{scrollbar-width:none}
  #app *::-webkit-scrollbar{display:none}
  button:focus-visible{outline:2px solid #7BE36F;outline-offset:2px}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:72px;padding:48px 32px;flex-wrap:wrap}
  @media (max-width:880px){.stage{gap:32px;padding:24px 16px}.side{width:100%!important;max-width:402px}}
  /* 分享版（<html data-share>）：沒有側欄，只有手機。
     桌機上是置中的手機外框；手機上直接全螢幕，拿掉假的瀏海、狀態列和底部橫條 */
  html[data-share] .side{display:none!important}
  html[data-share] .stage{padding:24px 16px;gap:0}
  @media (max-width:520px){
    html[data-share] body{background:#0B1A12}
    html[data-share] .stage{padding:0;min-height:100vh;min-height:100dvh;display:block}
    html[data-share] #device{width:100vw!important;height:100vh!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important;zoom:1!important}
    html[data-share] #device > div:not(#app){display:none!important}
    /* 真的手機：瀏覽器自己有狀態列，不用再留假狀態列的 58px；底部讓開 Home 指示條 */
    html[data-share] #app{--top:calc(env(safe-area-inset-top, 0px) + 18px);--bottom:calc(env(safe-area-inset-bottom, 0px) + 14px)}
  }
</style>
</head>
<body>
<div class="stage">

          <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#fff" stroke-opacity="0.35" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="#fff" fill-opacity="0.4"/></svg>
        </div>

    <div id="app" style="position:absolute;inset:0;container-type:size;display:flex;flex-direction:column;overflow:hidden;font-family:'Outfit','Noto Sans TC','PingFang TC',sans-serif;background:radial-gradient(130% 55% at 50% -8%,#2F6142 0%,rgba(47,97,66,0) 62%),radial-gradient(100% 50% at 110% 105%,#1E4D33 0%,rgba(30,77,51,0) 60%),linear-gradient(180deg,#14301F 0%,#0B1A12 100%)">
      <div id="screenHost" style="flex:1;display:flex;flex-direction:column;min-height:0;position:relative"></div>
      <div id="tabbar" style="position:absolute;left:16px;right:16px;bottom:var(--bottom,26px);z-index:40"></div>
      <div id="toast" style="position:absolute;bottom:104px;left:50%;transform:translateX(-50%);background:rgba(10,24,16,.84);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#F2F6F0;font-size:12.5px;padding:11px 18px;border-radius:999px;white-space:nowrap;z-index:80;display:none"></div>

<script>
(function(){
"use strict";

/* ── 產品名稱：只改這裡，抵達畫面、分享卡、側欄、分頁標題都會跟著換 ──
   「樹洞」同時也是每一棵樹的通稱（「找樹洞」「三個樹洞」），那些字不跟著產品名改 */
/* 分享版：<html data-share> 時不顯示側欄與任何檢閱用的控制 */
var SHARE = document.documentElement.hasAttribute('data-share');
var APP = { name:'樹洞', tagline:'把心事說給一棵真的樹聽。', motto:'真的樹，真的聽' };

/* ── 字體預覽：側欄可以即時切換手機裡的字體 ─────────────────
   都是 Google Fonts 上有繁體中文的字體，任何裝置打開都一樣。
   latin 是搭配的英數字體；null 代表直接用中文字體自己的英數字 */
var FONTS = [
  {key:'noto',    name:'思源黑體',   note:'目前使用 · 中性、清楚',     family:'Noto Sans TC',         q:'Noto+Sans+TC:wght@300;400;500;600',       latin:'Outfit'},
  {key:'chiron',  name:'昭源黑體',   note:'黑體 · 比思源更柔和',       family:'Chiron Hei HK',        q:'Chiron+Hei+HK:wght@300;400;500;600',      latin:'Outfit'},
  {key:'goround', name:'昭源甜圓',   note:'圓體 · 溫和、有親切感',     family:'Chiron GoRound TC',    q:'Chiron+GoRound+TC:wght@300;400;500;600',  latin:'Outfit'},
  {key:'huninn',  name:'粉圓',       note:'圓體 · 可愛、像在說話',     family:'Huninn',               q:'Huninn',                                  latin:null},
  {key:'iansui',  name:'芫荽',       note:'手寫感 · 像鉛筆寫的字',     family:'Iansui',               q:'Iansui',                                  latin:null},
  {key:'wenkai',  name:'霞鶩文楷',   note:'楷書 · 溫暖、有書卷氣',     family:'LXGW WenKai TC',       q:'LXGW+WenKai+TC:wght@300;400;700',         latin:null},
  {key:'serif',   name:'思源宋體',   note:'明體 · 安靜、正式',         family:'Noto Serif TC',        q:'Noto+Serif+TC:wght@300;400;500;600',      latin:null},
  {key:'cactus',  name:'仙人掌明體', note:'明體 · 古典、像老書',       family:'Cactus Classical Serif', q:'Cactus+Classical+Serif',                latin:null}
];
function fontStack(f){ return (f.latin ? "'" + f.latin + "'," : '') + "'" + f.family + "','PingFang TC','Microsoft JhengHei',sans-serif"; }
function loadFontCss(f){
  if(document.querySelector('link[data-font="'+f.key+'"]')) return;
  var l = document.createElement('link');
  l.rel = 'stylesheet'; l.setAttribute('data-font', f.key);
  l.href = 'https://fonts.googleapis.com/css2?family=' + f.q + '&display=swap';
  document.head.appendChild(l);
}
var FONT_KEY = 'noto';
function applyFont(key){
  var f = FONTS.filter(function(x){ return x.key === key; })[0] || FONTS[0];
  FONT_KEY = f.key;
  loadFontCss(f);
  document.getElementById('app').style.fontFamily = fontStack(f);
  if(!SHARE){ try{ localStorage.setItem('th-font', f.key); }catch(e){} }
  renderFontPicker();
}
function renderFontPicker(){
  var host = document.getElementById('fontPicker'); if(!host) return;
  host.innerHTML = '';
  host.appendChild(el('div','font-size:11px;color:#7A8A7E;margin-bottom:8px','字體預覽（只換手機裡的字）'));
  var grid = el('div','display:grid;grid-template-columns:1fr 1fr;gap:6px');
  FONTS.forEach(function(f){
    var a = f.key === FONT_KEY;
    var st = 'text-align:left;padding:9px 12px;border-radius:14px;cursor:pointer;font-family:' + fontStack(f).replace(/"/g,"'") + ';'
      + 'border:1px solid '+(a?'#14301F':'rgba(15,36,24,.14)')+';background:'+(a?'#14301F':'transparent')+';color:'+(a?'#F2F6F0':'#25382B');
    var b = el('button', st);
    b.appendChild(el('div','font-size:15px', f.name));
    b.appendChild(el('div','font-size:10.5px;opacity:.6;margin-top:2px;font-family:inherit', f.note));
    b.onclick = function(){ applyFont(f.key); };
    grid.appendChild(b);
  });
  host.appendChild(grid);
}

/* ── props（對應 .dc.html 的 data-props 預設值）─────────── */
var P = { weather:'起霧', replyDelaySec:3, startRings:487 };

/* ── state ──────────────────────────────────────────────── */
var S = {
  screen:0, thinking:false, gained:0, planted:false,
  quizStep:0, quizPick:[],
  matches:null, matchedVia:null, cardIdx:0, forestView:null,   /* 找樹洞：揭曉的樹洞、正在看的森林 */
  onb:{step:'arrive'},                                          /* 第一次打開走到哪一步 */
  myTree:'t28', chips:null, firstChat:false, morning:null,
  breathing:false, bDone:false, bIdx:0, phase:'', bScale:1, bDur:4, cycles:0,
  toast:'', replyCount:0, sceneMuted:false,
  /* 每棵樹各自一段對話；阿檜這段是示範用的舊對話 */
  chats:{ t28:[
    {isTree:true, hasImg:true, text:'早安，今天山上起霧了，空氣很好。給你看看。', time:'06:12 · 晨報'},
    {isMe:true, text:'今天好沒動力起床，最近的事一件接著一件來。', time:'06:47'},
    {isTree:true, text:'事情一件接一件，真的會累。跟你說個我的事：我被雷劈過兩次，樹幹裡空了一塊，到現在都沒長回來。不過我還是站得好好的，那個洞裡現在還住了一窩山雀。', time:'06:12'}
  ]}
};
function chat(){ return S.chats[S.myTree] || (S.chats[S.myTree] = []); }
var timers = [], br = false, ui = {}, ringSvgCache = null;
function t(fn, ms){ timers.push(setTimeout(fn, ms)); }

/* ── 視覺 token：深林綠底、玻璃卡片、白色膠囊主按鈕、亮綠只當點綴 ── */
var C = {
  text:'#F2F6F0', text2:'rgba(242,246,240,.7)', text3:'rgba(242,246,240,.46)',
  lime:'#7BE36F', ink:'#0F2418'
};
var GLASS      = 'background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)';
var CARD       = GLASS + ';border-radius:28px';
var BTN_PRIMARY= 'display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:999px;border:none;background:#fff;color:'+C.ink+';font-size:15px;font-weight:500;cursor:pointer';
var BTN_GLASS  = 'display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:999px;color:'+C.text+';font-size:14.5px;cursor:pointer;' + GLASS;
var CIRCLE     = 'width:44px;height:44px;flex-shrink:0;border-radius:50%;color:'+C.text+';display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;line-height:1;padding:0 0 2px;' + GLASS;
var PILL_SMALL = 'padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:'+C.text2+';font-size:12px;cursor:pointer;white-space:nowrap';
var TAG_ON_IMG = 'display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(15,36,24,.38);color:'+C.text+';font-size:11.5px;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)';
var TAG        = 'display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;color:'+C.text+';font-size:12px;white-space:nowrap;' + GLASS;
var EYEBROW    = 'font-size:12px;color:'+C.lime;
/* 邊距分開寫：padding 簡寫裡放 var()，之後用 cssText 追加樣式時整組會被瀏覽器丟掉 */
var SCROLL     = 'flex:1;overflow-y:auto;padding-top:var(--top,58px);padding-left:18px;padding-right:18px;padding-bottom:108px;min-height:0';

/* ── 資料 ───────────────────────────────────────────────── */
/* 畫面編號：0 是第一次打開（onboarding），1–7 是主要畫面 */
var LABELS = ['第一次打開','說說話','樹的日常','找樹洞','樹的邀請','分享','年輪種樹','即時風景'];

/* 森林：入口用個性，地理放在細節。三座都是真實的檜木林，座標給 Open-Meteo 抓當地天氣用。
   阿里山沿用原本三棵；拉拉山、大雪山的樹齡用林業署 2023 年重新檢測的數字（中央社 2023-04-12 報導） */
var FORESTS = {
  alishan:{ id:'alishan', persona:'常常起霧的老林', short:'阿里山', name:'巨木群棧道', place:'嘉義',
            range:'海拔約 2,000–2,200m', lat:23.51, lon:120.80, elev:2173,
            about:'棧道上有 36 棵紅檜巨木，每一棵都超過千歲。下午常常起霧。' },
  lala:   { id:'lala', persona:'長在一起的巨木林', short:'拉拉山', name:'巨木區', place:'桃園',
            range:'海拔 1,400–1,900m', lat:24.71, lon:121.43, elev:1650,
            about:'園區裡有二十多棵編號巨木，很多是好幾棵紅檜長在一起的。一年到頭雲霧都多。' },
  dxs:    { id:'dxs', persona:'鳥很多的高山林', short:'大雪山', name:'國家森林遊樂區', place:'台中',
            range:'海拔 2,000–2,600m', lat:24.27, lon:121.02, elev:2200,
            about:'紅檜、黃檜和鐵杉長在一起，是台灣有名的賞鳥地。藍腹鷴常常慢慢走過步道。' }
};
var FOREST_ORDER = ['alishan', 'lala', 'dxs'];

/* 樹：都是真的、有編號的紅檜。line 是它介紹自己的話，happy 是「說個開心的事」時它說的。
   有查到的海拔才寫 elev，沒有就顯示整座森林的海拔範圍 */
var TREES = {
  t1:  {id:'t1',  forest:'alishan', name:'1 號巨木', num:'1 號',  species:'紅檜', age:'約 1,500 歲', elev:'海拔 2,211m',
        fact:'站在棧道入口，每個人都會先經過它',
        line:'「我站在入口，每個人都會先經過我。不用想好要說什麼，先來就好。」',
        happy:'早上的霧散得剛剛好，陽光從樹縫照下來。一千多年了，我還是喜歡這個時候。'},
  t2:  {id:'t2',  forest:'alishan', name:'2 號巨木', num:'2 號',  species:'紅檜', age:'1,515 歲', elev:'海拔 2,204m',
        fact:'林業署重新量過，是量過的巨木裡最老的',

/* WMO 天氣代碼 → 畫面要用的天氣種類 */
function wmo(code){
  if(code === 0)                    return {kind:'clear',  label:'晴'};
  if(code === 1)                    return {kind:'clear',  label:'大致晴朗'};
  if(code === 2)                    return {kind:'partly', label:'晴時多雲'};
  if(code === 3)                    return {kind:'cloudy', label:'陰'};
  if(code === 45 || code === 48)    return {kind:'fog',    label:'起霧'};
  if(code >= 51 && code <= 57)      return {kind:'rain',   label:'毛毛雨', heavy:0.3};
  if(code >= 61 && code <= 67)      return {kind:'rain',   label:code >= 65 ? '大雨' : '下雨', heavy:code >= 65 ? 1 : 0.6};
  if(code >= 80 && code <= 82)      return {kind:'rain',   label:'陣雨', heavy:code === 82 ? 1 : 0.7};
  if((code >= 71 && code <= 77) || code === 85 || code === 86) return {kind:'snow', label:'下雪'};
  if(code >= 95)                    return {kind:'storm',  label:'雷雨', heavy:1};
  return {kind:'cloudy', label:'多雲'};
}
var WX_FORCE_CODE = {clear:0, partly:2, cloudy:3, fog:45, rain:63, storm:95, snow:73};
var TOD_TEMP = {'晨':14, '午':19, '暮':16, '夜':9};
var TOD_KIND = {'晨':'fog', '午':'partly', '暮':'clear', '夜':'clear'};   /* 沒有資料時的時段預設 */
/* fid：哪座森林，沒給就是「我的樹」所在的森林 */
function nowWeather(tod, fid){
  fid = fid || myTree().forest;
  if(WX_FORCE_CODE[WX_FORCE] != null){ var f = wmo(WX_FORCE_CODE[WX_FORCE]); f.temp = f.kind === 'snow' ? -2 : TOD_TEMP[tod]; f.src = 'force'; return f; }
  var live = LIVE_WX[fid];
  if(live){ var w = wmo(live.code); w.temp = live.temp; w.src = 'live'; return w; }
  return { kind:TOD_KIND[tod], label:null, temp:null, src:'default' };
}
/* 短短一句天氣：「14°C · 起霧」；還沒抓到資料就回空字串 */
function wxShort(fid){
  var w = nowWeather(curTod(), fid);
  return w.src === 'default' ? '' : (w.temp + '°C · ' + w.label);
}
function wx(){ return P.weather || '起霧'; }
/* 說說話抬頭的天氣：有真實天氣就用，沒有就用原本的示範句 */
function headWx(){ var s = wxShort(); return s ? ('現在 ' + s) : WX_HEADER[wx()]; }
/* 樹回話時順口提一句山上的天氣 */
function wxLine(){
  var tod = curTod(), w = nowWeather(tod);
  if(w.src === 'default') return WX_LINE[wx()] || '';
  return ({ fog:'山上的霧還沒散，', rain:'我這裡也在下雨，', storm:'山上在打雷，', snow:'山上下雪了，',
            cloudy:'山上雲很厚，', partly:'山上有幾朵雲，',
            clear: tod === '夜' ? '今晚山上看得到星星，' : '今天山上很亮，' })[w.kind] || '';
}
function now(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function rings(){ return Math.max(0, P.startRings + S.gained - (S.planted?500:0)); }

function el(tag, style, text){
  var n = document.createElement(tag);
  if(style) n.setAttribute('style', style);
  if(text != null) n.textContent = text;
  return n;
}
function hover(node, hoverStyle, normalStyle){
  node.addEventListener('mouseenter', function(){ node.style.cssText = normalStyle + ';' + hoverStyle; });
  node.addEventListener('mouseleave', function(){ node.style.cssText = normalStyle; });
}
function button(style, text, onclick, hoverStyle){
  var b = el('button', style, text);
  if(onclick) b.onclick = onclick;
  if(hoverStyle) hover(b, hoverStyle, style);
  return b;
}
function showToast(msg){
  S.toast = msg;
  var n = document.getElementById('toast');
  n.textContent = msg; n.style.display = 'block';
  t(function(){ n.style.display='none'; S.toast=''; }, 2600);
}
function go(n){ return function(){ setScreen(n); }; }

/* 柏樹線稿：深色背景上直接用（淺色線條）；淺色霧景裡用 filter 壓暗成剪影。
   原圖右緣的樹枝被裁到，用漸層遮罩讓右邊自然淡出，不會出現一條硬邊 */
var CYPRESS_MASK = '-webkit-mask-image:linear-gradient(90deg,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,#000 84%,transparent 100%);';
function cypress(style){
  var img = document.createElement('img');
  img.src = 'assets/cypress-line.png'; img.alt = '';
  img.setAttribute('style','position:absolute;pointer-events:none;' + CYPRESS_MASK + style);
  img.onerror = function(){ img.style.display = 'none'; };   /* 缺圖時安靜退場 */
  return img;
}
/* 完整的樹：原圖主幹在寬度 57% 處、右側樹枝被裁到。
   只取主幹左邊完整的那半，鏡像拼出右半，得到一棵左右對稱、置中的樹。
   原圖線條很細，最下面幾層的樹枝也沒畫到樹幹，縮小後看起來空空的：
   在畫布上把線條加粗一點，後面再鋪一層很淡的樹身，讓樹枝和樹幹連起來 */
var TREE_AXIS_PX = 181.5, FULL_CACHE = {}, FULL_DATA = {};   /* 依「顏色＋主角線條設定」各做一張、存起來 */
/* 畫布轉成圖片網址：用 blob 網址，不用很長的 data: 文字，網頁比較輕 */
function canvasUrl(cv){
  return new Promise(function(ok){
    if(cv.toBlob) cv.toBlob(function(b){ ok(b ? URL.createObjectURL(b) : cv.toDataURL('image/png')); }, 'image/png');
    else ok(cv.toDataURL('image/png'));
  });
}
/* tint：把整棵樹染成指定顏色（白天的主角用跟風景同一組的深綠）；沒給就是原本的淺色線稿 */
function fullTreeUrl(tint){
  var key = (tint || '') + JSON.stringify(TREE_LOOK);
  if(!FULL_CACHE[key]) FULL_CACHE[key] = treeSrc().then(function(im){
    var W = 363, H = 790;
    var base = document.createElement('canvas'); base.width = W; base.height = H;
    var b = base.getContext('2d');
    b.drawImage(im, 0, 0, 181.5, 790, 0, 0, 181.5, 790);
    b.save(); b.translate(W, 0); b.scale(-1, 1); b.drawImage(im, 0, 0, 181.5, 790, 0, 0, 181.5, 790); b.restore();
    /* 線條加粗：每個像素看周圍的點，離得越遠、影響越小（半徑 r 外 1 格內慢慢淡出），取最不透明的那個。
       跟以前「只算整格」不同，半徑從 0.7 調到 0.8 只會多一點點，不會突然跳一格 */
    var rad = TREE_LOOK.lineRadius, thick = base;
    if(rad > 0){
      var src = b.getImageData(0, 0, W, H), d = src.data, dil = b.createImageData(W, H), od = dil.data;
      var offs = [], R = Math.ceil(rad + 1);
      for(var dy=-R; dy<=R; dy++) for(var dx=-R; dx<=R; dx++){
        var dist = Math.sqrt(dx*dx + dy*dy), wgt = dist === 0 ? 1 : Math.max(0, Math.min(1, rad - dist + 1));
        if(wgt > 0) offs.push([dx, dy, wgt]);
      }
      for(var y=0; y<H; y++) for(var x=0; x<W; x++){
        var best = 0, bi = (y*W + x)*4;
        for(var q=0; q<offs.length; q++){
          var xx = x + offs[q][0], yy = y + offs[q][1];
          if(xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
          var ii = (yy*W + xx)*4, v = d[ii+3] * offs[q][2];
          if(v > best){ best = v; bi = ii; }
        }
        var oi = (y*W + x)*4;
        od[oi] = d[bi]; od[oi+1] = d[bi+1]; od[oi+2] = d[bi+2]; od[oi+3] = best;
      }
      thick = document.createElement('canvas'); thick.width = W; thick.height = H;
      thick.getContext('2d').putImageData(dil, 0, 0);
    }
    /* 樹身：線稿往四周擴開、模糊，很淡地鋪在後面，最下面幾層的樹枝才會跟樹幹連起來 */
    var out = document.createElement('canvas'); out.width = W; out.height = H;
    var o = out.getContext('2d');
    if(TREE_LOOK.bodyAlpha > 0){
      var body = document.createElement('canvas'); body.width = W; body.height = H;
      var bd = body.getContext('2d');
      for(var r=2; r<=TREE_LOOK.bodyReach; r+=2) for(var k=0; k<12; k++){ var an = k*Math.PI/6; bd.drawImage(base, Math.cos(an)*r, Math.sin(an)*r); }
      o.globalAlpha = TREE_LOOK.bodyAlpha;
      if('filter' in o) o.filter = 'blur(4px)';
      o.drawImage(body, 0, 0);
      if('filter' in o) o.filter = 'none';
      o.globalAlpha = 1;
    }
    o.drawImage(thick, 0, 0);
    if(tint){ o.globalCompositeOperation = 'source-in'; o.fillStyle = tint; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over'; }
    return canvasUrl(out).then(function(u){ return (FULL_DATA[key] = u); });
  });
  return FULL_CACHE[key];
}
/* 主角（發光的線稿樹）：線條加粗的半徑（原圖像素）、樹身擴多大、樹身多淡；調校頁可以改。背景樹另外看 BG_LOOK */
var TREE_LOOK = { lineRadius:0.9, bodyReach:8, bodyAlpha:0.08 };   /* 0.9 跟以前的 1 看起來差不多 */
function fullTree(style, tint){
  var wrap = el('div','position:absolute;pointer-events:none;aspect-ratio:'+(TREE_AXIS_PX*2)+' / 790;' + style);
  var putImg = function(url){
    wrap.innerHTML = '';
    var img = document.createElement('img');
    img.src = url; img.alt = '';
    img.setAttribute('style','position:absolute;inset:0;width:100%;height:100%');
    wrap.appendChild(img);
  };
  var ready = FULL_DATA[(tint || '') + JSON.stringify(TREE_LOOK)];
  if(ready){ putImg(ready); return wrap; }
  /* 還沒做好之前先用原圖兩半拼（要染色的就先空著，免得閃一下白色），做好就換掉；畫布不能用（例如直接開檔案）就一直用原圖 */
  for(var i=0; i<2 && !tint; i++){
    var half = el('div','position:absolute;top:0;bottom:0;width:50%;overflow:hidden;' + (i ? 'right:0;transform:scaleX(-1)' : 'left:0'));
    var img = document.createElement('img');
    img.src = 'assets/cypress-line.png'; img.alt = '';
    img.setAttribute('style','position:absolute;top:0;left:0;height:100%;width:auto;max-width:none');
    img.onerror = function(){ wrap.style.display = 'none'; };
    half.appendChild(img); wrap.appendChild(half);
  }
  fullTreeUrl(tint).then(putImg).catch(function(){});
  return wrap;
}
/* 生成的山景：取代照片，沒有授權問題。kind 是天氣（clear／partly／cloudy／fog／rain／storm／snow），預設起霧 */
var MINI_SKY = {
  clear: 'linear-gradient(180deg,#2E5A6B 0%,#7FA9A0 38%,#E3C793 66%,#6E8F66 100%)',
  partly:'linear-gradient(180deg,#3A6370 0%,#86AFA4 40%,#D3D5AE 66%,#62845F 100%)',
  cloudy:'linear-gradient(180deg,#4A5C55 0%,#7E8E86 42%,#AEB8B0 68%,#5A6E60 100%)',
  fog:   'linear-gradient(180deg,#3F6450 0%,#7E9F88 42%,#BFD1BC 68%,#5D7F62 100%)',
  rain:  'linear-gradient(180deg,#33423C 0%,#5E6D66 42%,#8C9A92 68%,#45584B 100%)',
  storm: 'linear-gradient(180deg,#232E2A 0%,#47534D 42%,#6E7A73 68%,#38483E 100%)',
  snow:  'linear-gradient(180deg,#5D6E6A 0%,#A6B5B0 42%,#DCE4E0 68%,#8FA297 100%)'
};
/* 每種天氣的山色：遠山、中景稜線、稜線上的樹、近坡、主樹；sea 是谷裡雲海的濃度，haze 是遠景的霧氣 */
var MINI_PAL = {
  clear: {far:'#86A79A', mid:'#557B67', conifer:'#3F6352', near:'#203B2C', tree:'#14261B', sea:.5,  haze:.16, birds:[2,3]},
  partly:{far:'#86A39A', mid:'#557966', conifer:'#3F6352', near:'#203A2C', tree:'#14261B', sea:.45, haze:.2,  birds:[2,3]},
  cloudy:{far:'#8E9C97', mid:'#62746B', conifer:'#4C5D55', near:'#26372E', tree:'#17251D', sea:.25, haze:.28, birds:[1,2]},
  fog:   {far:'#B3C4B9', mid:'#8BA594', conifer:'#7C9786', near:'#30493A', tree:'#1E3328', sea:.8,  haze:.45, birds:[1,1]},
  rain:  {far:'#75837D', mid:'#55645D', conifer:'#3F4D47', near:'#212E27', tree:'#141E19', sea:.2,  haze:.3,  birds:[0,0]},
  storm: {far:'#5C6863', mid:'#434F4A', conifer:'#323D38', near:'#1A241F', tree:'#101813', sea:.1,  haze:.25, birds:[0,0]},
  snow:  {far:'#D3DCD8', mid:'#A9B8B1', conifer:'#5E6F66', near:'#C7D1CC', tree:'#2B3A32', sea:.3,  haze:.3,  birds:[1,1]}
};
var MINI_UID = 0;
/* 平滑的 1D 雜訊：畫稜線用。同一個 seed 每次畫出來都一樣 */
function vnoise(seed){
  var r = function(i){ var x = Math.sin((i + seed*101.3)*127.1)*43758.5453; return x - Math.floor(x); };
  return function(x){ var i = Math.floor(x), f = x - i, u = (1 - Math.cos(f*Math.PI))/2; return r(i)*(1-u) + r(i+1)*u; };
}
/* 染好色的完整樹：在畫布上把線稿左半鏡像成對稱的樹，再整棵換成指定顏色，做成圖片重複使用。
   SVG 濾鏡在 <use> 上各瀏覽器不一定吃得到，所以改在畫布上先染好 */
var TREE_SRC = null, TINTED = {};
function treeSrc(){
  if(!TREE_SRC) TREE_SRC = new Promise(function(ok, no){ var im = new Image(); im.onload = function(){ ok(im); }; im.onerror = no; im.src = 'assets/cypress-line.png'; });
  return TREE_SRC;
}
/* 背景樹（剪影）的線條：加粗半徑、樹身底色濃度、樹身範圍。調校頁可以改，跟主角分開 */
var BG_LOOK = { lineRadius:4, bodyAlpha:0, bodyReach:8 };
/* 只看透明度的膨脹：先橫向、再直向取最大值（方形範圍），半徑大也很快 */
function dilateAlpha(a, W, H, R){
  if(R <= 0) return a;
  var t = new Uint8ClampedArray(W*H), o = new Uint8ClampedArray(W*H), x, y, k, m;
  for(y=0; y<H; y++) for(x=0; x<W; x++){ m = 0; for(k=-R; k<=R; k++){ var xx = x + k; if(xx >= 0 && xx < W && a[y*W+xx] > m) m = a[y*W+xx]; } t[y*W+x] = m; }
  for(y=0; y<H; y++) for(x=0; x<W; x++){ m = 0; for(k=-R; k<=R; k++){ var yy = y + k; if(yy >= 0 && yy < H && t[yy*W+x] > m) m = t[yy*W+x]; } o[y*W+x] = m; }
  return o;
}
function tintedTree(hex){
  var key = hex + JSON.stringify(BG_LOOK);
  if(!TINTED[key]) TINTED[key] = treeSrc().then(function(im){
    var W = 363, H = 790;
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    g.drawImage(im, 0, 0, 181.5, 790, 0, 0, 181.5, 790);
    g.save(); g.translate(W, 0); g.scale(-1, 1); g.drawImage(im, 0, 0, 181.5, 790, 0, 0, 181.5, 790); g.restore();
    /* 線稿很細，縮小後會透出天空、看起來發白：把線加粗成比較飽滿的剪影 */
    var img = g.getImageData(0, 0, W, H), d = img.data, al = new Uint8ClampedArray(W*H);
    for(var i=0; i<W*H; i++) al[i] = d[i*4+3];
    /* 半徑可以是小數：算出前後兩個整數半徑的結果，再依小數部分混合，數值才會連續變化 */
    var rr = Math.max(0, BG_LOOK.lineRadius), r0 = Math.floor(rr), fr = rr - r0;
    var dil = dilateAlpha(al, W, H, r0);
    if(fr > 0){
      var dil1 = dilateAlpha(al, W, H, r0 + 1), mix = new Uint8ClampedArray(W*H);
      for(var mi=0; mi<W*H; mi++) mix[mi] = dil[mi] + (dil1[mi] - dil[mi]) * fr;
      dil = mix;
    }
    var rgb = hexRgb255(hex);
    for(var j=0; j<W*H; j++){ d[j*4] = rgb[0]; d[j*4+1] = rgb[1]; d[j*4+2] = rgb[2]; d[j*4+3] = dil[j]; }
    var line = document.createElement('canvas'); line.width = W; line.height = H;
    line.getContext('2d').putImageData(img, 0, 0);
    var out = document.createElement('canvas'); out.width = W; out.height = H;
    var o = out.getContext('2d');
    /* 樹身：加粗後的剪影再往外擴、模糊，很淡地鋪在後面 */
    if(BG_LOOK.bodyAlpha > 0){
      o.globalAlpha = BG_LOOK.bodyAlpha;
      if('filter' in o) o.filter = 'blur(' + Math.max(2, BG_LOOK.bodyReach/2) + 'px)';
      for(var r=2; r<=BG_LOOK.bodyReach; r+=2) for(var k2=0; k2<12; k2++){ var an = k2*Math.PI/6; o.drawImage(line, Math.cos(an)*r, Math.sin(an)*r); }
      if('filter' in o) o.filter = 'none';
      o.globalAlpha = 1;
    }
    o.drawImage(line, 0, 0);
    return canvasUrl(out);
  });
  return TINTED[key];
}
function hexRgb255(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
/* 山景小圖：遠山、長滿針葉樹的稜線、谷裡的雲海、近坡上的樹群，主樹站在坡上，枝頭偶爾有鳥。
   kind 是天氣；seed 決定山的形狀，每座森林各自不同 */
function miniScene(h, tags, kind, seed){
  kind = MINI_SKY[kind] ? kind : 'fog';
  var P0 = MINI_PAL[kind], uid = 'ms' + (++MINI_UID);
  if(seed == null) seed = FOREST_ORDER.indexOf(myTree().forest) + 1;
  var s = el('div','position:relative;height:'+h+'px;border-radius:22px;overflow:hidden;background:'+MINI_SKY[kind]);
  s.setAttribute('data-kind', kind);
  if(kind === 'clear' || kind === 'partly'){
    s.appendChild(el('div','position:absolute;left:30%;top:34%;width:130px;height:130px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,236,190,'+(kind === 'clear' ? .85 : .5)+') 0%,rgba(255,236,190,0) 65%)'));
  }
  var nCloud = {partly:2, cloudy:3, rain:3, storm:3, snow:2}[kind] || 0;
  for(var i=0;i<nCloud;i++){
    var cc = kind === 'partly' ? 'rgba(240,244,236,.55)' : (kind === 'storm' || kind === 'rain') ? 'rgba(70,82,76,.6)' : 'rgba(200,208,204,.55)';
    s.appendChild(el('div','position:absolute;left:'+(-10 + i*34)+'%;top:'+(4 + (i%2)*9)+'%;width:60%;height:20%;border-radius:50%;background:'+cc+';filter:blur(12px);animation:th-drift '+(24 + i*6)+'s ease-in-out infinite'));
  }

  var nF = vnoise(seed*3 + 1), nM = vnoise(seed*5 + 2), nN = vnoise(seed*7 + 3);
  var rnd = (function(){ var k = seed*977; return function(){ k++; var x = Math.sin(k*91.7)*43758.5453; return x - Math.floor(x); }; })();
  var farY  = function(x){ return 96 - 30*(nF(x/58)*0.65 + nF(x/19 + 40)*0.25 + nF(x/7 + 80)*0.1); };
  var midY  = function(x){ return 128 - 16*(nM(x/70)*0.7 + nM(x/24 + 30)*0.3); };
  var nearY = function(x){ return 190 - 0.17*x - 7*nN(x/45); };
  var lipY  = function(x){ return 192 - 16*Math.max(0, 1 - Math.pow((x - 40)/150, 2)); };
  var line = function(fn, step){ var d = 'M-10 210 L-10 ' + fn(-10).toFixed(1); for(var x=-10; x<=410; x+=step) d += ' L'+x+' '+fn(x).toFixed(1); return d + ' L410 210 Z'; };

  var svg = '<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" style="position:absolute;inset:0;width:100%;height:100%;display:block" aria-hidden="true">'
    + '<defs><filter id="'+uid+'b" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>';
  /* 遠山 */
  svg += '<path d="'+line(farY, 4)+'" fill="'+P0.far+'"/>';
  svg += '<rect x="-10" y="40" width="420" height="120" fill="#E8EFE9" opacity="'+P0.haze+'"/>';
  /* 中景稜線＋上面一整排小針葉樹 */
  svg += '<path d="'+line(midY, 5)+'" fill="'+P0.mid+'"/>';
  var trees = '';
  for(var x=-6; x<408; x += 3.5 + rnd()*4){
    var th = 6 + rnd()*9, by = midY(x) + 2.5, w = th*0.3;
    trees += 'M'+(x-w).toFixed(1)+' '+by.toFixed(1)+'L'+x.toFixed(1)+' '+(by-th).toFixed(1)+'L'+(x+w).toFixed(1)+' '+by.toFixed(1)+'Z';
  }
  svg += '<path d="'+trees+'" fill="'+P0.conifer+'"/>';

    }
  }
  var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  return src;
}
function toOut(ctx, node, out, pan){
  if(ctx.createStereoPanner){ var p = ctx.createStereoPanner(); p.pan.value = pan || 0; node.connect(p); p.connect(out); }
  else node.connect(out);
}
function noiseLayer(ctx, out, kind, type, freq, q, gain){
  var src = noiseSrc(ctx, kind), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = type; f.frequency.value = freq; if(q) f.Q.value = q; g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(out); src.start();
  return { src:src, filter:f, gain:g };
}
/* 霧滴：很淡的空氣聲，加上隨機落下的水滴，偶爾彈一下 */
function sceneFog(ctx, out){
  var alive = true, bed = noiseLayer(ctx, out, 'pink', 'highpass', 1800, 0, 0.08);
  function drip(){
    if(!alive) return;
    var t0 = ctx.currentTime + 0.01, f = 1300 + Math.random()*1500, pan = Math.random()*1.6 - 0.8;
    var count = Math.random() < 0.25 ? 2 : 1;
    for(var k=0;k<count;k++){
      var tt = t0 + k*(0.09 + Math.random()*0.05), ff = f * (k ? 0.8 : 1);
      var o = ctx.createOscillator(), e = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(ff, tt);
      o.frequency.exponentialRampToValueAtTime(ff*0.55, tt + 0.07);
      e.gain.setValueAtTime(0.0001, tt);
      e.gain.exponentialRampToValueAtTime((k ? 0.22 : 0.45) * (0.5 + Math.random()*0.5), tt + 0.004);
      e.gain.exponentialRampToValueAtTime(0.0001, tt + 0.14);
      o.connect(e); toOut(ctx, e, out, pan);
      o.start(tt); o.stop(tt + 0.16);
    }
    setTimeout(drip, 220 + Math.random()*1100);
  }
  drip();
  return function(){ alive = false; try{ bed.src.stop(); }catch(e){} };
}
/* 風吹過樹冠：低沉的風加上高頻的葉子沙沙聲，一陣一陣 */
function sceneWind(ctx, out){
  var alive = true;
  var wind = noiseLayer(ctx, out, 'brown', 'bandpass', 500, 0.6, 0.5);
  var leaf = noiseLayer(ctx, out, 'pink',  'highpass', 3000, 0, 0.04);
  function gust(){
    if(!alive) return;
    var nowT = ctx.currentTime, s = Math.random();
    wind.gain.gain.setTargetAtTime(0.28 + s*0.72, nowT, 0.8);
    wind.filter.frequency.setTargetAtTime(350 + s*700, nowT, 1.0);
    leaf.gain.gain.setTargetAtTime(0.02 + s*0.1, nowT, 0.6);
    setTimeout(gust, 1400 + Math.random()*2600);
  }
  gust();
  return function(){ alive = false; try{ wind.src.stop(); }catch(e){} try{ leaf.src.stop(); }catch(e){} };
}
/* 山雀：遠遠的林間底噪，加上兩音一組、重複幾次的叫聲，從不同方向傳來 */
function sceneBirds(ctx, out){
  var alive = true, bed = noiseLayer(ctx, out, 'brown', 'lowpass', 700, 0, 0.18);
  function note(tt, f0, f1, dur, vol, pan){
    var o = ctx.createOscillator(), e = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, tt); o.frequency.exponentialRampToValueAtTime(f1, tt + dur);
    e.gain.setValueAtTime(0.0001, tt);
    e.gain.exponentialRampToValueAtTime(vol, tt + 0.012);
    e.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
    o.connect(e); toOut(ctx, e, out, pan);
    o.start(tt); o.stop(tt + dur + 0.02);
  }
  function phrase(){
    if(!alive) return;
    var tt = ctx.currentTime + 0.05, pan = Math.random()*1.4 - 0.7, vol = 0.2 + Math.random()*0.15;
    var base = 4200 + Math.random()*900, reps = 2 + Math.floor(Math.random()*3);
    for(var r=0;r<reps;r++){
      note(tt,        base*1.15, base,      0.07, vol,      pan);
      note(tt + 0.11, base*0.78, base*0.7,  0.09, vol*0.85, pan);
      tt += 0.28;
    }
    setTimeout(phrase, reps*280 + 1200 + Math.random()*3200);
  }
  phrase();
  return function(){ alive = false; try{ bed.src.stop(); }catch(e){} };
}
/* 蟲鳴：三隻蟲在不同方向，各自用自己的節奏「唧唧唧」 */
function sceneCrickets(ctx, out){
  var alive = true, bed = noiseLayer(ctx, out, 'brown', 'lowpass', 400, 0, 0.1);
  var bugs = [0,1,2].map(function(i){
    return { f:4300 + i*380 + Math.random()*200, pan:-0.6 + i*0.6, every:0.55 + Math.random()*0.35, vol:0.1 + Math.random()*0.06 };
  });
  function chirp(c){
    if(!alive) return;
    var t0 = ctx.currentTime + 0.02, pulses = 3 + Math.floor(Math.random()*2);
    for(var p=0;p<pulses;p++){
      var tt = t0 + p*0.032, o = ctx.createOscillator(), e = ctx.createGain();
      o.type = 'sine'; o.frequency.value = c.f;
      e.gain.setValueAtTime(0.0001, tt);
      e.gain.exponentialRampToValueAtTime(c.vol, tt + 0.006);
      e.gain.exponentialRampToValueAtTime(0.0001, tt + 0.024);
      o.connect(e); toOut(ctx, e, out, c.pan);
      o.start(tt); o.stop(tt + 0.03);
    }
    setTimeout(function(){ chirp(c); }, (c.every + Math.random()*0.15) * 1000);
  }
  bugs.forEach(function(c, i){ setTimeout(function(){ chirp(c); }, i*230); });
  return function(){ alive = false; try{ bed.src.stop(); }catch(e){} };
}
/* 遠處的貓頭鷹：低低的「呼——呼呼——」，隔一陣子才叫一次 */
function sceneOwl(ctx, out){
  var alive = true, lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(out);
  function hoot(tt, f, dur, vol, pan){
    var o = ctx.createOscillator(), e = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f*1.04, tt); o.frequency.exponentialRampToValueAtTime(f*0.94, tt + dur);
    e.gain.setValueAtTime(0.0001, tt);
    e.gain.exponentialRampToValueAtTime(vol, tt + 0.06);
    e.gain.setValueAtTime(vol, tt + dur*0.6);
    e.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
    o.connect(e); toOut(ctx, e, lp, pan);
    o.start(tt); o.stop(tt + dur + 0.05);
  }
  function call(){
    if(!alive) return;
    var tt = ctx.currentTime + 0.05, f = 360 + Math.random()*60, pan = Math.random()*1.2 - 0.6, vol = 0.11;
    hoot(tt,        f,      0.42, vol,      pan);
    hoot(tt + 0.75, f*0.97, 0.22, vol*0.8,  pan);
    hoot(tt + 1.05, f*0.95, 0.5,  vol*0.9,  pan);
    setTimeout(call, 6000 + Math.random()*7000);
  }
  setTimeout(call, 1500);
  return function(){ alive = false; };
}
/* 遠處的蟬：高頻的嘶聲帶著快速的顫動，一陣漸強、一陣漸弱 */
function sceneCicadas(ctx, out){
  var alive = true;
  var src = noiseSrc(ctx, 'pink'), bp = ctx.createBiquadFilter(), am = ctx.createGain(), swell = ctx.createGain();
  var lfo = ctx.createOscillator(), depth = ctx.createGain();
  bp.type = 'bandpass'; bp.frequency.value = 4800; bp.Q.value = 3;
  am.gain.value = 0.5; lfo.frequency.value = 62; depth.gain.value = 0.45;
  lfo.connect(depth); depth.connect(am.gain);
  swell.gain.value = 0.0001;
  src.connect(bp); bp.connect(am); am.connect(swell); swell.connect(out);
  src.start(); lfo.start();
  function cycle(){
    if(!alive) return;
    swell.gain.setTargetAtTime(1.2 + Math.random()*0.8, ctx.currentTime, 1.6);
    setTimeout(function(){ if(alive) swell.gain.setTargetAtTime(0.12, ctx.currentTime, 1.4); }, 4000 + Math.random()*3000);
    setTimeout(cycle, 9000 + Math.random()*5000);
  }
  cycle();
  return function(){ alive = false; try{ src.stop(); }catch(e){} try{ lfo.stop(); }catch(e){} };
}
/* 雨聲：持續的沙沙聲＋低頻的雨幕，加上密密的雨滴 */
function sceneRain(ctx, out){
  var alive = true;
  var hiss = noiseLayer(ctx, out, 'pink',  'bandpass', 1800, 0.5, 0.58);
  var low  = noiseLayer(ctx, out, 'brown', 'lowpass',  500,  0,   0.17);
  function drop(){
    if(!alive) return;
    var tt = ctx.currentTime + 0.01, o = ctx.createOscillator(), e = ctx.createGain(), f = 2200 + Math.random()*3200;
    o.type = 'sine';
    o.frequency.setValueAtTime(f, tt); o.frequency.exponentialRampToValueAtTime(f*0.6, tt + 0.02);
    e.gain.setValueAtTime(0.0001, tt);
    e.gain.exponentialRampToValueAtTime(0.02 + Math.random()*0.035, tt + 0.002);
    e.gain.exponentialRampToValueAtTime(0.0001, tt + 0.03);
    o.connect(e); toOut(ctx, e, out, Math.random()*1.8 - 0.9);
    o.start(tt); o.stop(tt + 0.04);
    setTimeout(drop, 25 + Math.random()*90);
  }
  drop();
  return function(){ alive = false; try{ hiss.src.stop(); }catch(e){} try{ low.src.stop(); }catch(e){} };
}
/* 雷聲：由畫面上的閃電觸發（隔幾秒才傳來，像真的有距離） */
var THUNDER = null;
function sceneThunder(ctx, out){
  var alive = true;
  function rumble(){
    if(!alive) return;
    var src = noiseSrc(ctx, 'brown'), lp = ctx.createBiquadFilter(), g = ctx.createGain(), tt = ctx.currentTime + 0.02;
    src.loop = false;
    lp.type = 'lowpass'; lp.frequency.value = 160 + Math.random()*80;
    g.gain.setValueAtTime(0.0001, tt);
    g.gain.exponentialRampToValueAtTime(0.9,  tt + 0.12);
    g.gain.exponentialRampToValueAtTime(0.35, tt + 0.6);
    g.gain.exponentialRampToValueAtTime(0.5,  tt + 0.9);
    g.gain.exponentialRampToValueAtTime(0.0001, tt + 2.0);
    src.connect(lp); lp.connect(g); g.connect(out);
    src.start(tt); src.stop(tt + 2.05);
  }
  THUNDER = rumble;
  return function(){ alive = false; if(THUNDER === rumble) THUNDER = null; };
}
/* 把幾種聲音疊在一起，各自調音量 */
function layered(layers){
  return function(ctx, out){
    var stops = layers.map(function(l){
      var g = ctx.createGain(); g.gain.value = l[1]; g.connect(out);
      return l[0](ctx, g);
    });
    return function(){ stops.forEach(function(s){ s(); }); };
  };
}
var SOUNDSCAPES = {
  fog:sceneFog, wind:sceneWind, birds:sceneBirds,
  /* 即時風景：跟著山上的時段 */
  'scene-晨': layered([[sceneFog, 0.8], [sceneBirds, 0.7], [sceneWind, 0.35]]),   /* 霧滴、山雀（近）、風很輕 */
  'scene-午': layered([[sceneCicadas, 1], [sceneWind, 0.6]]),                    /* 蟬（遠）、風吹過樹冠 */
  'scene-暮': layered([[sceneWind, 0.8], [sceneBirds, 0.6]]),                    /* 晚風、山雀歸巢 */
  'scene-夜': layered([[sceneCrickets, 1], [sceneOwl, 1]]),                      /* 蟲鳴、貓頭鷹（遠） */
  /* 天氣蓋過時段：下雨、雷雨、下雪 */
  'wx-rain':  layered([[sceneRain, 1], [sceneWind, 0.35]]),
  'wx-storm': layered([[sceneRain, 1.2], [sceneWind, 0.6], [sceneThunder, 1]]),
  'wx-snow':  layered([[sceneWind, 0.45]])
};
function sceneKey(tod, w){
  if(w.kind === 'storm') return 'wx-storm';
  if(w.kind === 'rain')  return 'wx-rain';
  if(w.kind === 'snow')  return 'wx-snow';
  return 'scene-' + tod;
}
function playSound(key){
  if(SND.key === key) return;
  stopSound();
  var ctx = sndCtx(); if(!ctx || !SOUNDSCAPES[key]) return;
  var bus = ctx.createGain();
  bus.gain.setValueAtTime(0.0001, ctx.currentTime);
  bus.gain.exponentialRampToValueAtTime(Math.max(0.0001, 0.9*TUNE.volume), ctx.currentTime + 0.8);
  bus.connect(SND.out);
  SND.key = key; SND.bus = bus; SND.stopScene = SOUNDSCAPES[key](ctx, bus);
}
function stopSound(){
  if(!SND.key) return;
  var ctx = SND.ctx, bus = SND.bus, stop = SND.stopScene, nowT = ctx.currentTime;
  SND.key = null; SND.bus = null; SND.stopScene = null;
  bus.gain.cancelScheduledValues(nowT);
  bus.gain.setValueAtTime(Math.max(bus.gain.value, 0.0001), nowT);
  bus.gain.exponentialRampToValueAtTime(0.0001, nowT + 0.4);
  setTimeout(function(){ stop(); try{ bus.disconnect(); }catch(e){} }, 450);
}
function toggleSound(key){ if(SND.key === key) stopSound(); else playSound(key); }

/* ── 對話 ───────────────────────────────────────────────── */
function msgNode(m){
  if(m.isNote) return el('div','align-self:center;font-size:11px;color:'+C.text3+';padding:2px 0', m.text);

  var wrap, bub;
  if(m.isTree){
    wrap = el('div','max-width:84%;align-self:flex-start');
    bub  = el('div', GLASS + ';border-radius:6px 22px 22px 22px;padding:13px 16px;font-size:15px;line-height:1.75;color:'+C.text, m.text);
    if(m.hasImg){
      /* 這是畫出來的山景，不是影像：標籤只寫那時的天氣，不宣稱「即時影像」 */
      var sc = miniScene(132, ['早上 06:10 · 起霧 · 14°C']);
      sc.style.marginTop = '12px';
      bub.appendChild(sc);
    }
    wrap.appendChild(bub);
    /* 樹問了一個問題（例如要不要收晨報）：答案直接放在泡泡下面，答過就收起來 */
    if(m.actions && !m.answered){
      var acts = el('div','display:flex;gap:8px;margin-top:8px');
      m.actions.forEach(function(a){
        acts.appendChild(button(PILL_SMALL + ';padding:9px 16px;font-size:13px;color:'+C.text, a.label, function(){ answerAction(m, a); }, 'background:rgba(255,255,255,.14)'));
      });
      wrap.appendChild(acts);
    }
    wrap.appendChild(el('div','font-size:10.5px;color:'+C.text3+';margin-top:6px;padding-left:6px', m.time));
  } else {
    wrap = el('div','max-width:78%;align-self:flex-end');
    bub  = el('div','background:#fff;color:'+C.ink+';border-radius:22px 6px 22px 22px;padding:12px 16px;font-size:14.5px;line-height:1.7', m.text);
    wrap.appendChild(bub);
    wrap.appendChild(el('div','font-size:10.5px;color:'+C.text3+';margin-top:6px;text-align:right;padding-right:6px', m.time));
  }
  return wrap;
}
function scrollChat(){ if(ui.chat) ui.chat.scrollTop = ui.chat.scrollHeight; }
function pushMsg(m){
  chat().push(m);
  if(S.screen===1 && ui.chat){
    if(ui.thinkNode) ui.chat.insertBefore(msgNode(m), ui.thinkNode);
    else ui.chat.appendChild(msgNode(m));
    scrollChat();
  }
}
function setThinking(on){
  S.thinking = on;
  if(S.screen!==1 || !ui.chat) return;
  if(on && !ui.thinkNode){
    var n = el('div','align-self:flex-start;display:flex;align-items:center;gap:9px;border-radius:6px 22px 22px 22px;padding:11px 16px;' + GLASS);
    n.appendChild(el('span','font-size:13px;color:'+C.text2, myTree().name + '在想'));
    var dots = el('span','display:flex;gap:4px');
    [0,.3,.6].forEach(function(d){ dots.appendChild(el('span','width:5px;height:5px;border-radius:50%;background:'+C.lime+';animation:th-dots 1.8s '+d+'s infinite')); });
    n.appendChild(dots);
    ui.chat.appendChild(n); ui.thinkNode = n; scrollChat();
  } else if(!on && ui.thinkNode){
    ui.thinkNode.remove(); ui.thinkNode = null;
  }
}
function chipReply(v){
  if(v === '說說今天')     return '好，今天過得怎麼樣？想到什麼就說什麼。';
  if(v === '只是想來坐坐') return '好啊，坐吧。'+wxLine()+'不說話也沒關係。';
  if(v.indexOf('累')  >= 0) return '辛苦了。'+wxLine()+'累的話就少說一點，坐一下也好。';
  if(v.indexOf('開心')>= 0) return myTree().happy;
  if(v.indexOf('樹洞')>= 0) return '好，我聽到了。還有想說的，就繼續說。';
  return null;
}
/* 樹先開口：自我介紹＋它那座山現在的天氣 */
function greeting(tree){
  var f = FORESTS[tree.forest], s = wxShort(tree.forest);
  var wxs = s ? (f.short + '現在 ' + s.replace(' · ', '，') + '。') : '';
  return '你好，我是' + tree.name + '。' + wxs + bare(tree.line);
}
/* 第一次跟這棵樹說話：開場白＋三個中性的起頭 */
function startChat(tree){
  S.myTree = tree.id;
  S.chats[tree.id] = [{isTree:true, text:greeting(tree), time:now()}];
  S.chips = ['說說今天', '只是想來坐坐', '說個開心的事'];
  S.firstChat = true;
}
function answerAction(m, a){
  m.answered = true;
  if(a.id === 'morning-yes') S.morning = true;
  if(a.id === 'morning-no')  S.morning = false;
  renderScreen();
  pushMsg({isMe:true, text:a.label, time:now()});
  t(function(){ pushMsg({isTree:true, text:a.reply, time:now()}); }, 900);
}
function send(text){
  var v = (text != null ? text : (ui.input ? ui.input.value : '')).trim();
  if(!v || S.thinking) return;
  if(text == null && ui.input) ui.input.value = '';
  if(S.chips){ S.chips = null; if(ui.chips){ ui.chips.remove(); ui.chips = null; } }

  pushMsg({isMe:true, text:v, time:now()});
  pushMsg({isNote:true, text:'收到了'});
  setThinking(true);

  t(function(){
    setThinking(false);
    var pool = [
      '嗯，我聽著。'+wxLine()+'不用整理好再說，想到哪，說到哪就可以。',
      '好，我記下來了。'+wxLine()+'你慢慢說，不用急。'
    ];
    var r = chipReply(v) || pool[S.replyCount % pool.length];
    S.replyCount++; S.gained += 1;
    pushMsg({isTree:true, text:r, time:now()});
    /* 第一次對話：回完第一句之後，順口問要不要收晨報 */
    if(S.firstChat){
      S.firstChat = false;
      t(function(){
        pushMsg({isTree:true, time:now(), text:'對了，明天早上太陽出來的時候，要不要我寫封晨報給你？跟你說說山上的樣子。',
          actions:[{id:'morning-yes', label:'好啊',   reply:'好，明天早上見。'},
                   {id:'morning-no',  label:'先不用', reply:'好。想看的時候，點上面的「今天的晨報」就有。'}]});
      }, 1600);
    }
  }, P.replyDelaySec * 1000);
}

/* ── 呼吸練習：五次就好，做完自動停下；年輪安靜地長，不在畫面上計數 ── */
var PHASES = [['吸氣',4,1.32], ['停一下',2,1.32], ['慢慢吐氣',6,1]];
var BREATH_ROUNDS = 5;
var PHASE_END = [4/12, 6/12, 1];   /* 各階段結束時在「一次呼吸」裡的進度（4s＋2s＋6s） */
function paintBreath(){
  if(!ui.bCircle) return;
  ui.bCircle.style.transform  = 'scale('+S.bScale+')';
  ui.bCircle.style.transition = 'transform '+S.bDur+'s cubic-bezier(.4,0,.4,1)';
  ui.bLabel.textContent = S.breathing ? S.phase : (S.bDone ? '完成' : '跟我呼吸');
  ui.bBtn.textContent   = S.breathing ? '停下來' : (S.bDone ? '再一次' : '開始');
  ui.bNote.textContent  = (S.bDone && !S.breathing) ? '想要的時候，隨時回來跟我一起呼吸。' : '';
  /* 進度條：跟著呼吸節奏連續填滿，五次做完剛好滿 */
  var pct = S.bDone ? 100 : (S.breathing ? ((S.cycles + PHASE_END[S.bIdx]) / BREATH_ROUNDS) * 100 : 0);
  ui.bBar.style.opacity   = (S.breathing || S.bDone) ? '1' : '0';
  ui.bFill.style.transition = S.breathing ? ('width '+S.bDur+'s linear') : 'width .6s ease';
  ui.bFill.style.width    = pct + '%';
}
/* 每按一次開始／停下來就換一個編號：上一輪還沒觸發的計時器發現編號不對就結束，
   避免「停下來」後馬上「開始」時，兩條呼吸節奏同時在跑 */
var breathGen = 0;
function stepB(i, gen){
  if(!br || gen !== breathGen) return;
  if(i === PHASES.length){
    S.cycles++; S.gained++;
    if(S.cycles >= BREATH_ROUNDS){
      br=false; S.breathing=false; S.bDone=true; S.phase=''; S.bScale=1; S.bDur=1.4;
      paintBreath();
    } else {
      stepB(0, gen);
    }
    return;
  }
  S.bIdx = i; S.phase = PHASES[i][0]; S.bDur = PHASES[i][1]; S.bScale = PHASES[i][2];
  paintBreath();
  t(function(){ stepB(i+1, gen); }, PHASES[i][1]*1000);
}
function toggleBreath(){
  breathGen++;
  if(br){ br=false; S.breathing=false; S.phase=''; S.bScale=1; S.bDur=1; S.cycles=0; paintBreath(); return; }
  br = true; S.breathing = true; S.bDone = false; S.cycles = 0; stepB(0, breathGen);
}

/* ── 年輪 SVG（有機同心圓，一次生成後沿用）──────────────── */
function ringSvg(){
  if(ringSvgCache) return ringSvgCache;
  var rnd = function(seed){ var x = Math.sin(seed*127.1)*43758.5453; return x - Math.floor(x); };
  var out = '<svg width="210" height="210" viewBox="0 0 210 210" style="overflow:visible;display:block">';
  for(var i=0;i<13;i++){
    var base = 10 + i*7.2 + (rnd(i*3+1)-0.5)*1.5;
    var cx = 105 + (rnd(i*5+2)-0.5)*4, cy = 105 + (rnd(i*7+3)-0.5)*4;
    var a1 = 0.025+rnd(i*11+4)*0.035, a2 = 0.015+rnd(i*13+5)*0.03, a3 = 0.008+rnd(i*17+6)*0.02;
    var p1 = rnd(i*19+7)*6.28, p2 = rnd(i*23+8)*6.28, p3 = rnd(i*29+9)*6.28;
    var N = 40, pts = [];
    for(var k=0;k<N;k++){
      var th = k/N*6.28318;
      var r = base*(1 + a1*Math.sin(2*th+p1) + a2*Math.sin(3*th+p2) + a3*Math.sin(5*th+p3));
      pts.push([cx + r*Math.cos(th), cy + r*Math.sin(th)]);
    }
    var d = 'M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(var k2=0;k2<N;k2++){
      var p0=pts[(k2-1+N)%N], pA=pts[k2], pB=pts[(k2+1)%N], p2b=pts[(k2+2)%N];
      var c1=[pA[0]+(pB[0]-p0[0])/6, pA[1]+(pB[1]-p0[1])/6];
      var c2=[pB[0]-(p2b[0]-pA[0])/6, pB[1]-(p2b[1]-pA[1])/6];
      d += 'C'+c1[0].toFixed(1)+' '+c1[1].toFixed(1)+' '+c2[0].toFixed(1)+' '+c2[1].toFixed(1)+' '+pB[0].toFixed(1)+' '+pB[1].toFixed(1);
    }
    var sw    = (1.2+rnd(i*31+10)*0.8).toFixed(2);
    var dur   = (0.7+base/60).toFixed(2);
    var delay = (0.2+i*0.5).toFixed(2);
    var op    = (0.5+rnd(i*37+11)*0.4).toFixed(2);
    var rot   = 'rotate('+Math.round(rnd(i*41+12)*360)+' 105 105)';
    out += '<path d="'+d+'Z" pathLength="100" fill="none" stroke="#A5EA98" stroke-width="'+sw+'" stroke-linecap="round" transform="'+rot+'" '
        +  'style="stroke-dasharray:100 100;animation:th-draw '+dur+'s cubic-bezier(.5,.1,.4,1) '+delay+'s both;opacity:'+op+'"/>';
  }
  ringSvgCache = out + '</svg>';
  return ringSvgCache;
}

/* ── 星空：閃爍的星星＋偶爾劃過的流星（畫布）────────────────
   星星位置只生成一次，每分鐘重畫風景時不會跳動 */
var STARFIELD = null;
function starfield(){
  if(STARFIELD && STARFIELD.length === Math.round(TUNE.starCount)) return STARFIELD;
  var rnd = function(seed){ var x = Math.sin(seed*91.7)*43758.5453; return x - Math.floor(x); };
  STARFIELD = [];
  for(var i=0;i<Math.round(TUNE.starCount);i++){
    var r = 0.4 + Math.pow(rnd(i*7+1), 3) * 1.3;
    STARFIELD.push({
      x: rnd(i*3+2),
      y: Math.pow(rnd(i*5+3), 1.5),          /* 越靠近天頂越多，靠近稜線越少 */
      r: r,
      a: 0.35 + rnd(i*11+4)*0.6,
      sp: 0.6 + rnd(i*13+5)*2.2,             /* 每顆星閃爍的快慢都不同 */
      dp: 0.25 + rnd(i*19+8)*0.6,            /* 閃爍的幅度也不同：有的只微微變暗 */
      ph: rnd(i*17+6)*6.283,
      big: r > 1.25
    });
  }
  return STARFIELD;
}
/* amt：星星的整體亮度（晴＝1、晴時多雲＝0.5）；meteorsOn：只有晴朗的夜才有流星 */
function mountSky(root, amt, meteorsOn){
  var cv = document.createElement('canvas');
  cv.setAttribute('style','position:absolute;left:0;top:0;width:100%;height:74%;pointer-events:none');
  cv.setAttribute('aria-hidden','true');
  root.appendChild(cv);
  var stars = starfield();
  var still = reduceMotion();
  var meteors = [], nextMeteor = performance.now() + 1200 + Math.random()*2500;
  function spawn(w, h, nowT){
    var left = Math.random() < 0.7;                       /* 多半往左下，偶爾往右下 */
    var ang = (left ? 145 + Math.random()*15 : 20 + Math.random()*15) * Math.PI/180;
    return { x0: left ? w*(0.35 + Math.random()*0.65) : w*Math.random()*0.6, y0: h*Math.random()*0.35,
             cos: Math.cos(ang), sin: Math.sin(ang), v: (520 + Math.random()*260)*TUNE.meteorSpeed,
             life: (900 + Math.random()*450)/Math.sqrt(TUNE.meteorSpeed), len: (90 + Math.random()*70)*TUNE.meteorLength, t0: nowT };
  }
  function frame(nowT){
    if(!cv.isConnected) return;                           /* 離開畫面就停 */
    var dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
    var g = cv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    g.fillStyle = '#F2F6F0';
    var dpK = TUNE.twinkleDepth, spK = TUNE.twinkleSpeed, rK = TUNE.starSize;
    stars.forEach(function(s){
      var a = Math.min(1, amt * TUNE.starBright * (still ? s.a : s.a * (1 - Math.min(1, s.dp*dpK)*(0.5 - 0.5*Math.sin(nowT*0.001*s.sp*spK + s.ph)))));
      var x = s.x*w, y = s.y*h, sr = s.r*rK;
      if(s.big){
        /* 亮星的光暈：從中心往外漸淡，不是一圈實心的圓 */
        var halo = g.createRadialGradient(x, y, 0, x, y, sr*4.5);
        halo.addColorStop(0, 'rgba(242,246,240,'+(a*0.45)+')');
        halo.addColorStop(1, 'rgba(242,246,240,0)');
        g.globalAlpha = 1; g.fillStyle = halo;
        g.beginPath(); g.arc(x, y, sr*4.5, 0, 6.283); g.fill();
        g.fillStyle = '#F2F6F0';
      }
      g.globalAlpha = a; g.beginPath(); g.arc(x, y, sr, 0, 6.283); g.fill();
    });
    if(meteorsOn && !still && nowT > nextMeteor){
      meteors.push(spawn(w, h, nowT));
      nextMeteor = nowT + TUNE.meteorEvery*1000*(0.55 + Math.random()*0.9);   /* 平均間隔 meteorEvery 秒 */
    }
    meteors = meteors.filter(function(m){ return nowT - m.t0 < m.life; });
    meteors.forEach(function(m){
      var tt = (nowT - m.t0)/1000, p = (nowT - m.t0)/m.life;
      var hx = m.x0 + m.cos*m.v*tt, hy = m.y0 + m.sin*m.v*tt;
      var tl = Math.min(m.len, m.v*tt);
      var tx = hx - m.cos*tl, ty = hy - m.sin*tl;
      var fade = p < 0.15 ? p/0.15 : (p > 0.65 ? (1-p)/0.35 : 1);
      var grad = g.createLinearGradient(hx, hy, tx, ty);
      grad.addColorStop(0, 'rgba(242,246,240,'+(0.95*fade)+')');
      grad.addColorStop(1, 'rgba(242,246,240,0)');
      g.globalAlpha = 1; g.strokeStyle = grad; g.lineWidth = 1.6; g.lineCap = 'round';
      g.beginPath(); g.moveTo(hx, hy); g.lineTo(tx, ty); g.stroke();
      g.globalAlpha = fade; g.beginPath(); g.arc(hx, hy, 1.6, 0, 6.283); g.fill();
    });

    requestAnimationFrame(frame);
  }

}

/* 雨、雪、閃電：畫在樹與山的前面 */
function mountPrecip(root, kind, heavy){
  var cv = document.createElement('canvas');
  cv.setAttribute('style','position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none');
  cv.setAttribute('aria-hidden','true');
  root.appendChild(cv);
  var still = reduceMotion();
  var snow = kind === 'snow', n = Math.round((snow ? 70 : 70 + 160*heavy) * (snow ? TUNE.snowDensity : TUNE.rainDensity)), parts = [];
  var last = performance.now(), flashT = -1, nextFlash = last + 2500 + Math.random()*Math.min(5000, TUNE.lightningEvery*500);
  function seed(w, h, anywhere){
    return snow
      ? { x:Math.random()*w, y:anywhere ? Math.random()*h : -6, r:1 + Math.random()*1.6, v:(25 + Math.random()*35)*TUNE.snowSpeed, ph:Math.random()*6.283 }
      : { x:Math.random()*w*(1 + TUNE.rainSlant), y:anywhere ? Math.random()*h : -30, len:10 + Math.random()*14, v:(650 + Math.random()*350)*TUNE.rainSpeed };
  }
  function frame(nowT){
    if(!cv.isConnected) return;
    var dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
    if(!parts.length) for(var i=0;i<n;i++) parts.push(seed(w, h, true));
    var dt = Math.min(0.05, (nowT - last)/1000); last = nowT;
    var g = cv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    if(snow){
      g.fillStyle = 'rgba(242,246,240,.8)';
      parts.forEach(function(p, i){
        if(!still){ p.y += p.v*dt; p.x += Math.sin(nowT*0.001 + p.ph)*8*TUNE.snowSway*dt; }
        if(p.y > h + 6) parts[i] = seed(w, h, false);
        g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.fill();
      });
    } else {
      g.strokeStyle = 'rgba(214,230,220,'+(0.22 + 0.18*heavy)+')'; g.lineWidth = 1;
      g.beginPath();
      parts.forEach(function(p, i){
        if(!still){ p.y += p.v*dt; p.x -= p.v*TUNE.rainSlant*dt; }
        if(p.y > h + 20 || p.x < -20) { parts[i] = p = seed(w, h, false); }
        g.moveTo(p.x, p.y); g.lineTo(p.x + p.len*TUNE.rainSlant, p.y - p.len);
      });
      g.stroke();
    }
    /* 雷雨：閃一下（偶爾連閃兩下），幾秒後傳來雷聲 */
    if(kind === 'storm' && !still){
      if(nowT > nextFlash){
        flashT = nowT; nextFlash = nowT + TUNE.lightningEvery*1000*(0.57 + Math.random()*0.86);   /* 平均間隔 lightningEvery 秒 */
        if(THUNDER) setTimeout(THUNDER, 800 + Math.random()*1700);
      }
      if(flashT >= 0){
        var e = nowT - flashT, a = e < 80 ? 0.5 : e < 160 ? 0.08 : e < 240 ? 0.35 : Math.max(0, 0.35 - (e - 240)/450);
        if(a > 0){ g.fillStyle = 'rgba(235,242,238,'+Math.min(1, a*TUNE.flash)+')'; g.fillRect(0, 0, w, h); } else flashT = -1;
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ── 即時風景的山：遠山、長滿針葉樹的稜線、谷裡的雲海、主樹站的山肩、前景土坡 ──
   座標是 400×870 的直式畫面，拉伸填滿（不同手機比例只會稍微壓扁），
   這樣主樹「離底部 30%」的位置剛好落在山肩上 */
var LAND_PAL = {
  '晨':{far:'#7E9E8C', mid:'#557A65', conifer:'#456B57', near:'#355A43', fore:'#1B3527', haze:'#DDE7DB'},
  '午':{far:'#7FA48C', mid:'#4F7A5E', conifer:'#3F6A50', near:'#2E5C3F', fore:'#173323', haze:'#DCEBD6'},
  '暮':{far:'#7A6B4F', mid:'#4E4A35', conifer:'#3D3D2C', near:'#2E3A28', fore:'#18221A', haze:'#E8C08A'},
  '夜':{far:'#1E3328', mid:'#152A1E', conifer:'#11231A', near:'#0D1D14', fore:'#08130D', haze:'#5E7A6C'}
};
var LAND_UID = 0;
/* 白天主樹的顏色：比山肩深一階，同一個色相 */
var HERO_TINT = {'晨':'#18301F', '午':'#122B1B', '暮':'#1C2216'};
function landscape(tod, kind, treeX){
  var P = JSON.parse(JSON.stringify(LAND_PAL[tod])), night = tod === '夜', uid = 'ls' + (++LAND_UID);
  if(kind === 'snow'){ P.near = night ? '#3B4A43' : '#B9C4BF'; P.fore = night ? '#2A3631' : '#9AA8A1'; P.far = night ? '#3A4A44' : '#D4DDD9'; }
  var sea  = Math.min(1, ({'晨':.55, '午':.3, '暮':.35, '夜':.12}[tod]) * ({fog:1.6, partly:1, clear: tod === '晨' ? 1 : .6, cloudy:.8, rain:.5, storm:.3, snow:.6}[kind] || 1) * TUNE.cloudSea);
  var haze = Math.min(.9, ({fog:.55, cloudy:.25, rain:.3, storm:.35, snow:.3, clear:.1, partly:.14}[kind] || .1) * TUNE.haze);
  var seed = FOREST_ORDER.indexOf(myTree().forest) + 1;
  var nF = vnoise(seed*3 + 11), nM = vnoise(seed*5 + 12), nN = vnoise(seed*7 + 13);
  var rnd = (function(){ var k = seed*331; return function(){ k++; var x = Math.sin(k*78.2)*43758.5453; return x - Math.floor(x); }; })();
  var PK = TUNE.peakHeight, AX = treeX/100*400, AY = 870*(1 - TUNE.treeBase/100);   /* 山肩頂點＝主樹站的地方（離底部 treeBase%） */
  var DY = AY - 609;   /* 樹往下移多少，中景和雲海也跟著下來一半，比例才不會跑掉 */
  var farY  = function(x){ return 548 - 150*PK*(nF(x/70)*0.6 + nF(x/23 + 40)*0.28 + nF(x/8 + 90)*0.12); };
  var midY  = function(x){ return 588 + DY*0.5 - 46*PK*(nM(x/80)*0.7 + nM(x/26 + 30)*0.3); };
  var nearY = function(x){
    var d = x - AX, ad = Math.abs(d);
    /* 左邊坡長、右邊坡短，不對稱；用平滑的絕對值，山肩頂端是圓的，也不會有接縫 */
    var base = AY + (d < 0 ? 0.36 : 0.22) * (Math.sqrt(d*d + 60*60) - 60);   /* 頂端寬一點、平一點，樹根才站得住 */
    return base + 6*(nN(x/40) - 0.5) * Math.min(1, ad/40);                 /* 稜線有點起伏，主樹腳下保持平 */
  };
  var foreY = function(x){ return 812 - 26*Math.max(0, 1 - Math.pow((x - 70)/190, 2)) - 8*nN(x/30 + 70); };
  var path = function(fn, step){ var d = 'M-10 880 L-10 ' + fn(-10).toFixed(1); for(var x=-10; x<=410; x+=step) d += ' L'+x+' '+fn(x).toFixed(1); return d + ' L410 880 Z'; };
  var svg = '<svg viewBox="0 0 400 870" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none" aria-hidden="true">'
    + '<defs><filter id="'+uid+'b" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>'
    + '<linearGradient id="'+uid+'h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.haze+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.haze+'" stop-opacity="1"/></linearGradient></defs>';
  /* 遠山：最淡，底部再罩一層霧氣 */
  svg += '<path d="'+path(farY, 4)+'" fill="'+P.far+'"/>';
  svg += '<rect x="-10" y="420" width="420" height="190" fill="url(#'+uid+'h)" opacity="'+(0.35 + haze).toFixed(2)+'"/>';
  /* 中景稜線＋一整排小針葉樹 */
  svg += '<path d="'+path(midY, 5)+'" fill="'+P.mid+'"/>';
  var trees = '';
  for(var x=-6; x<408; x += 3 + rnd()*4.5){
    var th = 8 + rnd()*12, by = midY(x) + 3, w = th*0.28;
    trees += 'M'+(x-w).toFixed(1)+' '+by.toFixed(1)+'L'+x.toFixed(1)+' '+(by-th).toFixed(1)+'L'+(x+w).toFixed(1)+' '+by.toFixed(1)+'Z';
  }
  svg += '<path d="'+trees+'" fill="'+P.conifer+'"/>';
  if(haze > 0.2) svg += '<rect x="-10" y="520" width="420" height="110" fill="url(#'+uid+'h)" opacity="'+(haze*0.8).toFixed(2)+'"/>';
  /* 谷裡的雲海改由 mountMist 的畫布來畫（會一直往同一邊飄），這裡只留山 */
  /* 主樹站的山肩：從左下爬到主樹，右邊再緩緩下去 */
  svg += '<path d="'+path(nearY, 4)+'" fill="'+P.near+'"/>';
  /* 旁邊的樹：站在山肩和中景稜線上的剪影，先放空的 image，染好色再填進去 */
  var buddy = function(cx, base, ht, col, op){ var w = ht*363/790; return '<image data-tint="'+col+'" x="'+(cx - w/2).toFixed(1)+'" y="'+(base - ht).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+ht+'" preserveAspectRatio="none" opacity="'+Math.min(1, op*TUNE.companions).toFixed(2)+'"/>'; };
  [[0.12, 70], [0.24, 92], [0.38, 64]].forEach(function(b){ var bx = b[0]*400; svg += buddy(bx, nearY(bx) + 4, b[1], P.conifer, night ? .7 : .85); });
  [[AX + 70, 78], [AX + 110, 58]].forEach(function(b){ if(b[0] < 410) svg += buddy(b[0], nearY(b[0]) + 4, b[1], P.conifer, night ? .7 : .85); });
  /* 前景：深色土坡、草，左下角一棵被畫面切到的大樹 */
  svg += '</svg>';
  var backSvg = svg;
  /* ── 前面那一層：畫在主樹前面，把樹根壓進土裡，再接前景 ── */
  var front = '<svg viewBox="0 0 400 870" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none" aria-hidden="true">';
  front += '<path d="'+path(function(x){ return nearY(x) + 5; }, 4)+'" fill="'+P.near+'"/>';
  /* 樹腳邊的草：比山坡深一點，蓋住樹根和山坡的接縫 */
  var tuft = '';
  for(var tx=AX-46; tx<=AX+46; tx += 3 + rnd()*4){
    var ty = nearY(tx) + 5.5, tth = 4 + rnd()*5;
    tuft += 'M'+tx.toFixed(1)+' '+ty.toFixed(1)+'q-1.5 -'+(tth*0.6).toFixed(1)+' -3 -'+tth.toFixed(1)+'M'+tx.toFixed(1)+' '+ty.toFixed(1)+'q1.5 -'+(tth*0.5).toFixed(1)+' 3.5 -'+(tth*0.9).toFixed(1);
  }
  front += '<path d="'+tuft+'" fill="none" stroke="'+P.fore+'" stroke-opacity=".75" stroke-width="1.1" stroke-linecap="round"/>';
  svg = front;
  svg += '<path d="'+path(foreY, 6)+'" fill="'+P.fore+'"/>';
  var grass = '';
  for(var gx=0; gx<240; gx += 6 + rnd()*9){
    var gy = foreY(gx) + 1, gh = 8 + rnd()*9;
    grass += 'M'+gx.toFixed(1)+' '+gy.toFixed(1)+'q-3 -'+(gh*0.6).toFixed(1)+' -6 -'+gh.toFixed(1)
          +  'M'+gx.toFixed(1)+' '+gy.toFixed(1)+'q0 -'+(gh*0.7).toFixed(1)+' 1.5 -'+(gh*1.15).toFixed(1)
          +  'M'+gx.toFixed(1)+' '+gy.toFixed(1)+'q3 -'+(gh*0.5).toFixed(1)+' 7 -'+(gh*0.85).toFixed(1);
  }
  svg += '<path d="'+grass+'" fill="none" stroke="'+P.fore+'" stroke-width="1.4" stroke-linecap="round"/>';
  if(TUNE.foreTree > 0) svg += buddy(-14, 880, 330, P.fore, TUNE.foreTree / Math.max(0.01, TUNE.companions));
  svg += '</svg>';
  var mk = function(str){
    var h = el('div','position:absolute;inset:0');
    h.innerHTML = str;
    Array.prototype.forEach.call(h.querySelectorAll('image[data-tint]'), function(im){
      tintedTree(im.getAttribute('data-tint')).then(function(url){ im.setAttribute('href', url); }).catch(function(){});
    });
    return h;
  };
  return { back: mk(backSvg), front: mk(svg), sea: sea, valleyY: (600 + DY*0.6) / 870, groundY: (AY + 12) / 870 };
}

/* ── 會飄的雲和霧：很多柔軟的霧團，持續往同一邊飄、飄出去從另一邊回來，
   每一團自己慢慢變濃變淡、微微伸縮，看起來像在流動，不是一整塊在原地擺 ── */
var MIST_SPRITES = {};
function mistSprite(hex){
  if(MIST_SPRITES[hex]) return MIST_SPRITES[hex];
  var c = document.createElement('canvas'); c.width = c.height = 128;
  var g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.45, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = hex; g.fillRect(0, 0, 128, 128);
  return (MIST_SPRITES[hex] = c);
}
/* o：color 顏色、n 幾團、y0／y1 在畫面高度的哪一段（0 是頂端）、rx／ry 霧團寬高範圍（px）、
   alpha 濃度、speed 每秒往右飄幾 px（範圍）、bob 上下浮動幅度 */
function mountMist(root, o){
  if(!(o.alpha > 0.005) || !(o.n > 0)) return;
  var cv = document.createElement('canvas');
  cv.setAttribute('style','position:absolute;inset:0;width:100%;height:100%;pointer-events:none');
  cv.setAttribute('aria-hidden','true');
  root.appendChild(cv);
  var spr = mistSprite(o.color), still = reduceMotion();
  var blobs = null, last = performance.now(), R = function(a){ return a[0] + Math.random()*(a[1] - a[0]); };
  function make(w, h, anywhere){
    var rx = R(o.rx), ry = R(o.ry);
    return { rx:rx, ry:ry, x: anywhere ? -rx + Math.random()*(w + 2*rx) : -rx - Math.random()*60, y: h*(o.y0 + Math.random()*(o.y1 - o.y0)),
             v: R(o.speed), a: o.alpha*(0.45 + Math.random()*0.55), w1: 0.25 + Math.random()*0.4, w2: 0.1 + Math.random()*0.2,   /* 濃淡約 10–25 秒一輪，伸縮再慢一點 */
             p1: Math.random()*6.283, p2: Math.random()*6.283, bob: (o.bob || 4)*(0.5 + Math.random()) };

  function frame(nowT){
    if(!cv.isConnected) return;
    var dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); blobs = null; }
    if(!blobs){ blobs = []; for(var i=0; i<o.n; i++) blobs.push(make(w, h, true)); }
    var dt = Math.min(0.05, (nowT - last)/1000), t = nowT/1000; last = nowT;
    var g = cv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    blobs.forEach(function(b, i){
      if(!still){ b.x += b.v*dt; if(b.x - b.rx*1.1 > w) blobs[i] = b = make(w, h, false); }
      var breathe = still ? 1 : 0.7 + 0.3*Math.sin(t*b.w1 + b.p1);          /* 慢慢變濃變淡 */
      var sc = still ? 1 : 1 + 0.08*Math.sin(t*b.w2 + b.p2);               /* 微微伸縮 */
      var yy = b.y + (still ? 0 : Math.sin(t*b.w2*1.3 + b.p1)*b.bob);      /* 上下浮一點 */
      g.globalAlpha = Math.min(1, b.a*breathe);

    });

  }

/* ── 天空的雲：一朵朵用好幾團大小不一的圓疊起來，上緣一顆顆鼓起、底部比較平、邊緣柔和，
   每朵形狀都不同；晴天的薄雲做成細長一絲一絲的。整朵一起往右飄、慢慢變濃變淡 ── */
function cloudSprite(hex, wispy){
  var W = 360, H = 170, c = document.createElement('canvas'); c.width = W; c.height = H;
  var g = c.getContext('2d'), puff = function(x, y, r, a){
    var gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,'+a+')'); gr.addColorStop(0.55, 'rgba(255,255,255,'+(a*0.75)+')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  };
  if(wispy){
    /* 薄雲：一串扁扁的小團，沿著微微斜的線排開 */
    var n = 9 + Math.floor(Math.random()*5), slope = (Math.random() - 0.5)*0.25;
    for(var i=0; i<n; i++){
      var t = i/(n - 1), x = 30 + t*300 + (Math.random() - 0.5)*20, y = 85 + (t - 0.5)*300*slope + (Math.random() - 0.5)*10;
      g.save(); g.translate(x, y); g.scale(1, 0.38); puff(0, 0, 26 + Math.random()*22, 0.55); g.restore();

    /* 一朵雲：中間的團比較大、兩邊漸小；底部再鋪一條讓它平一點 */

      var u = j/(k - 1), bell = Math.exp(-Math.pow((u - 0.5)/0.32, 2));
      var r = 30 + bell*34 + Math.random()*10;                         /* 兩端的團也夠大，才會跟中間連在一起，不會像掉出來的球 */
      puff(80 + u*200 + (Math.random() - 0.5)*12, base - r*0.5 - bell*10 + (Math.random() - 0.5)*6, r, 0.85);

    g.save(); g.translate(W/2, base + 2); g.scale(1, 0.22); puff(0, 0, 135, 0.6); g.restore();

}
/* o：color、n 幾朵、y0／y1 在畫面高度的哪一段、size 寬度範圍（px）、alpha、speed（px/s）、wispy 薄雲 */
function mountClouds(root, o){
  if(!(o.alpha > 0.005) || !(o.n > 0)) return;
  var cv = document.createElement('canvas');
  cv.setAttribute('style','position:absolute;inset:0;width:100%;height:100%;pointer-events:none');
  cv.setAttribute('aria-hidden','true');
  root.appendChild(cv);
  var still = reduceMotion(), sprites = [], R = function(a){ return a[0] + Math.random()*(a[1] - a[0]); };
  for(var i=0; i<5; i++) sprites.push(cloudSprite(o.color, o.wispy));
  var list = null, last = performance.now();
  function make(w, h, anywhere){
    var cw = R(o.size), spr = sprites[Math.floor(Math.random()*sprites.length)];
    return { spr:spr, w:cw, h:cw*170/360, x: anywhere ? -cw + Math.random()*(w + cw) : -cw - Math.random()*80,
             y: h*(o.y0 + Math.random()*(o.y1 - o.y0)), v: R(o.speed)*(0.8 + cw/600), a: o.alpha*(0.6 + Math.random()*0.4),
             w1: 0.15 + Math.random()*0.25, p1: Math.random()*6.283, flip: Math.random() < 0.5 };
  }
  function frame(nowT){
    if(!cv.isConnected) return;
    var dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); list = null; }
    if(!list){ list = []; for(var i=0; i<o.n; i++) list.push(make(w, h, true)); list.sort(function(a, b){ return a.w - b.w; }); }
    var dt = Math.min(0.05, (nowT - last)/1000), t = nowT/1000; last = nowT;
    var g = cv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    list.forEach(function(c, i){
      if(!still){ c.x += c.v*dt; if(c.x > w + 10) list[i] = c = make(w, h, false); }
      g.globalAlpha = Math.min(1, c.a*(still ? 1 : 0.8 + 0.2*Math.sin(t*c.w1 + c.p1)));
      if(c.flip){ g.save(); g.translate(c.x + c.w, c.y); g.scale(-1, 1); g.drawImage(c.spr, 0, 0, c.w, c.h); g.restore(); }
      else g.drawImage(c.spr, c.x, c.y, c.w, c.h);
    });
    g.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function screen7(){
  var tod = curTod(), sc = SCENES[tod], w = nowWeather(tod), night = tod === '夜';
  var root = el('div','flex:1;position:relative;overflow:hidden;background:'+sc.sky+';min-height:0');
  root.setAttribute('data-screen-label','7 即時風景');
  root.setAttribute('data-weather', w.kind);

  /* 進到這一頁就直接播山上的聲音（跟著時段與天氣）；使用者按過暫停，就尊重他的選擇 */
  var sKey = sceneKey(tod, w);
  if(!S.sceneMuted) playSound(sKey);

  /* 天氣決定：有沒有星星、天色多暗、霧多濃、有沒有雲 */
  var starAmt = night ? ({clear:1, partly:0.5}[w.kind] || 0) : 0;
  var dim     = Math.min(0.9, ({cloudy:0.16, rain:0.3, storm:0.42, snow:0.12, fog:0.04}[w.kind] || 0) * TUNE.dim);
  var fogAmt  = Math.min(1, ({clear: tod === '晨' ? 0.2 : 0.06, partly:0.14, cloudy:0.22, fog:0.6, rain:0.3, storm:0.25, snow:0.3}[w.kind]) * TUNE.fog);
  var clouds  = {partly:2, cloudy:4, rain:4, storm:4, snow:3}[w.kind] || 0;

  if(starAmt > 0) mountSky(root, starAmt, w.kind === 'clear');
  if(dim > 0) root.appendChild(el('div','position:absolute;inset:0;background:rgba(18,26,22,'+dim+')'));
  /* 天空的雲：很多霧團往右飄；晴天只有幾絲薄雲，晴朗的晚上不放（要看星星） */
  var cloudCol = night ? '#33453B' : dim >= 0.3 ? '#8C9892' : tod === '暮' ? '#D9C3A2' : '#DCE5DD';
  var cloudA = (night ? .5 : dim >= 0.3 ? .42 : .34) * TUNE.cloudOpacity;
  var cloudN = clouds > 0 ? clouds*2 + 2 : (night ? 0 : 3);
  mountClouds(root, { color:cloudCol, n:cloudN, y0:.06, y1:.36, size: clouds > 0 ? [170, 320] : [200, 340], wispy: clouds === 0,
                      alpha: (clouds > 0 ? cloudA*1.6 : cloudA*0.9), speed:[8*TUNE.cloudSpeed, 16*TUNE.cloudSpeed] });
  /* 構圖：阿檜稍微偏右（59%），像隨手拍下的風景而不是置中的紀念照；
     也跟靠左的標題與聲音按鈕取得平衡。背後的光暈跟著阿檜 */
  var TREE_X = TUNE.treeX;
  root.appendChild(el('div','position:absolute;left:0;right:0;bottom:'+(TUNE.treeBase - 6)+'%;height:40%;background:radial-gradient(60% 50% at '+TREE_X+'% 70%,rgba(123,227,111,.10) 0%,rgba(123,227,111,0) 70%)'));
  /* 山：遠山、稜線上的樹、雲海、主樹站的山肩（後面那層）；樹根前的土和前景（前面那層） */
  var land = landscape(tod, w.kind, TREE_X);
  root.appendChild(land.back);
  /* 背景樹之間、山谷裡的霧：在稜線和山肩之間流動 */
  var mistCol = night ? '#4C6357' : dim >= 0.3 ? '#C9D2CD' : '#EEF3EC';
  mountMist(root, { color:mistCol, n:16, y0:land.valleyY - .05, y1:land.groundY - .01, rx:[60,150], ry:[10,24],
                    alpha: Math.min(.9, land.sea*0.55 + fogAmt*0.35), speed:[9*TUNE.fogSpeed, 17*TUNE.fogSpeed], bob:4 });
  /* 阿檜：完整對稱、比旁邊的樹大也清楚得多 */
  /* 樹包在一層會擺動的容器裡：擺幅 treeSway 度（0 就不動），一輪 swaySpeed 秒 */
  /* 原圖最下面約 7% 是空白：往下移這麼多，樹根才會踩在山肩上 */
  var treeBox = el('div','position:absolute;left:'+TREE_X+'%;bottom:'+(TUNE.treeBase - TUNE.treeHeight*0.075).toFixed(2)+'%;height:'+TUNE.treeHeight+'%;transform:translateX(-50%)');
  var treeSway = el('div','height:100%;transform-origin:50% 100%;--sway:'+TUNE.treeSway+'deg;' + (TUNE.treeSway > 0 ? 'animation:th-swayv '+TUNE.swaySpeed+'s ease-in-out infinite' : ''));
  /* 白天的主樹染成跟風景同一組的深綠（以前是把白線稿壓暗，偏藍灰、跟山不搭）；晚上維持發光的淺色線稿 */
  var heroTint = w.kind === 'snow' ? '#22302A' : HERO_TINT[tod];
  treeSway.appendChild(fullTree('position:relative;display:block;height:100%;' + (night ? 'opacity:'+TUNE.treeNightOpacity+';filter:drop-shadow(0 0 10px rgba(123,227,111,.22))' : 'opacity:'+TUNE.treeDayOpacity), night ? null : heroTint));
  treeBox.appendChild(treeSway); root.appendChild(treeBox);
  root.appendChild(land.front);
  /* 主樹腳邊的地面霧：最靠近，飄得最快，遠近才有層次 */
  mountMist(root, { color:mistCol, n:9, y0:land.groundY - .02, y1:land.groundY + .07, rx:[80,170], ry:[12,26],
                    alpha: Math.min(.8, fogAmt*0.75), speed:[15*TUNE.fogSpeed, 26*TUNE.fogSpeed], bob:3 });
  if(w.kind === 'fog') root.appendChild(el('div','position:absolute;inset:0;background:linear-gradient(180deg,rgba(200,212,204,0) 20%,rgba(200,212,204,'+Math.min(1, (night ? 0.14 : 0.32)*TUNE.fog)+') 100%)'));
  if(w.kind === 'rain' || w.kind === 'storm' || w.kind === 'snow') mountPrecip(root, w.kind, w.heavy || 0.6);

  var top = el('div','position:absolute;top:calc(var(--top,58px) + 4px);left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;gap:8px');
  var live = el('span', TAG_ON_IMG);
  live.appendChild(el('span','width:7px;height:7px;border-radius:50%;background:'+C.lime+';animation:th-pulse 3s infinite'));
  live.appendChild(document.createTextNode('LIVE · ' + myForest().short + ' · ' + (myTree().elev || myForest().range)));
  top.appendChild(live);
  var wxText = w.src === 'default' ? sc.temp : ('現在 · ' + w.temp + '°C · ' + w.label + (starAmt >= 1 ? ' · 看得到星星' : ''));
  top.appendChild(el('span', TAG_ON_IMG, wxText));
  root.appendChild(top);
  root.appendChild(el('div','position:absolute;top:calc(var(--top,58px) + 54px);left:20px;right:20px;font-size:40px;font-weight:300;line-height:1.15;letter-spacing:2px;color:'+C.text, myTree().name + '的山'));

  var bottom = el('div','position:absolute;left:18px;right:18px;bottom:104px;display:flex;flex-direction:column;align-items:flex-start;gap:10px');
  var on = SND.key === sKey;
  var pst = 'display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;color:'+C.text+';font-size:12.5px;cursor:pointer;white-space:nowrap;'
    + 'border:1px solid '+(on?'rgba(123,227,111,.55)':'rgba(255,255,255,.2)')+';background:'+(on?'rgba(123,227,111,.16)':'rgba(15,36,24,.38)')+';backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)';
  var pill = button(pst, (on ? '❚❚  ' : '▶  ') + '山上的聲音', function(){
    if(SND.key === sKey){ stopSound(); S.sceneMuted = true; }
    else { playSound(sKey); S.sceneMuted = false; }
    renderScreen();
  });
  pill.setAttribute('aria-label', on ? '暫停山上的聲音' : '播放山上的聲音');
  bottom.appendChild(pill);
  root.appendChild(bottom);
  return root;
}

var BUILDERS = [screen0, screen1, screen2, screen3, screen4, screen5, screen6, screen7];

/* ── chrome：側欄、浮動分頁列 ───────────────────────────── */
function renderSidebar(){
  var host = document.getElementById('screenList');
  if(!host || SHARE) return;
  host.innerHTML = '';
  LABELS.forEach(function(label, i){
    var n = i, a = S.screen === n;
    var st = 'display:flex;align-items:center;gap:12px;padding:11px 18px;border-radius:999px;'
      + 'border:1px solid '+(a?'#14301F':'rgba(15,36,24,.12)')+';background:'+(a?'#14301F':'transparent')+';'
      + 'color:'+(a?'#F2F6F0':'#25382B')+';font-size:13.5px;cursor:pointer;text-align:left;transition:background .3s';
    var b = el('button', st);
    b.appendChild(el('span','font-size:11px;font-variant-numeric:tabular-nums;opacity:.5','0'+n));
    b.appendChild(el('span','font-weight:500', label));
    b.onclick = go(n);
    hover(b,'background:'+(a?'#14301F':'rgba(15,36,24,.06)'), st);
    host.appendChild(b);
  });
}
function renderTabs(){
  var host0 = document.getElementById('tabbar');
  host0.style.display = S.screen === 0 ? 'none' : '';   /* 第一次打開的流程不顯示分頁列 */
  var map = {'我的樹':[1,2,4,5], '森林':[3], '風景':[7], '年輪':[6]};
  var to  = {'我的樹':1, '森林':3, '風景':7, '年輪':6};
  var host = document.getElementById('tabbar');
  host.innerHTML = '';
  var bar = el('div','display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(12,28,19,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.28)');
  Object.keys(map).forEach(function(k){
    var a = map[k].indexOf(S.screen) >= 0;
    var st = 'flex:1;padding:11px 0;border-radius:999px;border:none;cursor:pointer;font-size:13px;font-weight:'+(a?'600':'400')+';background:'+(a?'#fff':'transparent')+';color:'+(a?C.ink:C.text2)+';transition:background .25s';
    bar.appendChild(button(st, k, go(to[k]), a ? null : 'color:'+C.text));
  });
  host.appendChild(bar);
}

function renderScreen(){
  ui.chat = null; ui.thinkNode = null; ui.input = null; ui.chips = null; ui.headWx = null;
  ui.bCircle = null; ui.bLabel = null; ui.bBtn = null; ui.bBar = null; ui.bFill = null; ui.bNote = null;
  var host = document.getElementById('screenHost');
  host.innerHTML = '';
  host.appendChild(BUILDERS[S.screen]());
}
function setScreen(n){
  if(S.screen === n && n !== 0){ return; }
  if(S.screen === 0 || S.screen === 3 || S.screen === 7) stopSound();   /* 離開找樹洞、第一次打開或即時風景，聲音淡出 */
  /* 從側欄點「第一次打開」：每次都從頭開始；離開它時，找樹洞的進度不要帶走 */
  if(n === 0){ S.onb = {step:'arrive'}; resetFind(); }
  else if(S.screen === 0){ resetFind(); }
  S.screen = n;
  renderScreen(); renderTabs(); renderSidebar();
}

/* ── 給內部調校頁用的介面（同網域的 iframe 才拿得到）──────────
   scene(時段, 天氣)：切到即時風景並固定時段與天氣；天氣傳 null 就用真實天氣
   apply()：TUNE 改完之後重畫 */
window.__TH = {
  TUNE: TUNE, DEFAULT: TUNE_DEFAULT,
  scene: function(tod, wx){
    HOUR_FORCE = String({'晨':7, '午':13, '暮':17, '夜':22}[tod] != null ? {'晨':7, '午':13, '暮':17, '夜':22}[tod] : new Date().getHours());
    WX_FORCE = wx || null;
    if(S.screen !== 7) setScreen(7); else renderScreen();
  },
  LOOK: TREE_LOOK, BGLOOK: BG_LOOK, lookKey: JSON.stringify(TREE_LOOK),
  apply: function(){
    STARFIELD = null;
    if(SND.bus && SND.ctx) SND.bus.gain.setTargetAtTime(Math.max(0.0001, 0.9*TUNE.volume), SND.ctx.currentTime, 0.1);
    if(S.screen === 7) renderScreen();
  },
  mute: function(on){ S.sceneMuted = !!on; if(on) stopSound(); else if(S.screen === 7) renderScreen(); },
  /* 測試用：現在在播哪一組聲音、輸出的音量大小 */
  soundKey: function(){ return SND.key; },
  level: function(){
    if(!SND.ctx) return 0;
    if(!SND.an){ SND.an = SND.ctx.createAnalyser(); SND.an.fftSize = 2048; SND.out.connect(SND.an); }
    var buf = new Float32Array(SND.an.fftSize); SND.an.getFloatTimeDomainData(buf);
    var sum = 0; for(var i=0;i<buf.length;i++) sum += buf[i]*buf[i];
    return Math.sqrt(sum / buf.length);
  }
};

/* ── 啟動 ───────────────────────────────────────────────── */
if(document.getElementById('appName')) document.getElementById('appName').textContent = APP.name;
/* 字體：先把每個選項的字體表載進來，按鈕才能用自己的字體顯示；?font=wenkai 可以直接指定 */
/* 分享版不預載其他字體、也不讀本機記住的選擇，只認網址上的 ?font= */
if(!SHARE) FONTS.forEach(loadFontCss);
(function(){ var k = QS.get('font'); if(!k && !SHARE){ try{ k = localStorage.getItem('th-font'); }catch(e){} } applyFont(k || 'noto'); })();
document.title = SHARE ? APP.name : (APP.name + ' · 互動原型');
/* 分享版在桌機上：手機外框依視窗高度等比縮小，矮螢幕也看得到整支手機 */
function fitDevice(){
  if(!SHARE) return;
  var d = document.getElementById('device');
  d.style.zoom = window.innerWidth <= 520 ? '' : String(Math.min(1, (window.innerHeight - 48) / 874));
}
fitDevice(); window.addEventListener('resize', fitDevice);
/* 預設從第一次打開開始；?screen=1 之類的網址參數可以直接跳到某個畫面 */
if(QS.get('mute')) S.sceneMuted = true;   /* 調校頁的縮圖不要出聲 */
(function(){ var q = QS.get('screen'); if(q !== null && q !== '' && !isNaN(+q) && BUILDERS[+q]) S.screen = +q; })();
renderSidebar(); renderTabs(); renderScreen();
/* 三座森林的天氣：一開始抓一次，之後每 10 分鐘更新 */
if(!QS.get('nofetch')){ fetchWeather(); setInterval(fetchWeather, 10 * 60 * 1000); }
/* 每分鐘重算山上的時段，讓風景跟著真實時間走 */
setInterval(function(){
  if(S.screen === 7) renderScreen();
}, 60000);

})();
