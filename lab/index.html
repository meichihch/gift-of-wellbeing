<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>即時風景調校</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 內部工具：放在 /lab/，用 iframe 載入分享版的即時風景，直接改裡面的 TUNE */
  :root{ --bg:#E3E8E2; --ink:#0F2418; --ink2:#46594B; --ink3:#7A8A7E; --line:rgba(15,36,24,.14); --dark:#14301F; --lime:#3FA535; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC',system-ui,sans-serif;font-size:13px}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:18px 24px 10px}
  h1{font-size:20px;font-weight:500;margin:0}
  header p{margin:0;color:var(--ink2);font-size:12.5px}
  .tabs{display:flex;gap:6px;padding:0 24px 12px}
  .tabs button,.seg button,.btn{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
  .tabs button.on,.seg button.on{background:var(--dark);border-color:var(--dark);color:#F2F6F0}
  .btn.primary{background:var(--dark);border-color:var(--dark);color:#F2F6F0}
  .wrap{display:flex;gap:28px;padding:0 24px 24px;align-items:flex-start}
  .phone{flex-shrink:0;border-radius:40px;overflow:hidden;box-shadow:0 30px 60px rgba(15,36,24,.25),0 0 0 1px rgba(15,36,24,.2);background:#000;position:relative}
  .phone iframe{border:0;width:402px;height:874px;transform-origin:0 0;position:absolute;left:0;top:0}
  .panel{flex:1;min-width:300px;max-width:760px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .row .lab{width:44px;color:var(--ink3);font-size:12px}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
  .group{border:1px solid var(--line);border-radius:16px;padding:12px 14px 6px;background:rgba(255,255,255,.35)}
  .group h3{margin:0 0 8px;font-size:13px;font-weight:500}
  .sl{display:grid;grid-template-columns:100px 1fr 62px 74px;align-items:center;gap:8px;margin-bottom:8px}
  .num{width:100%;font:inherit;font-size:12px;font-variant-numeric:tabular-nums;text-align:right;border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:rgba(255,255,255,.7);color:var(--ink)}
  .num:focus{outline:2px solid var(--dark);outline-offset:0}
  .track{position:relative}
  .track .def{position:absolute;top:-3px;width:2px;height:6px;border-radius:1px;background:var(--ink3);transform:translateX(-1px);pointer-events:none}
  .rs{font:inherit;font-size:11px;border:1px solid var(--line);background:transparent;color:var(--ink3);border-radius:999px;padding:3px 8px;cursor:pointer;white-space:nowrap;text-align:center}
  .sl.changed .rs{color:var(--ink);border-color:var(--dark)}
  .sl:not(.changed) .rs{cursor:default}
  .group h3{display:flex;justify-content:space-between;align-items:center}
  .group h3 button{font:inherit;font-size:11px;font-weight:400;border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:3px 9px;cursor:pointer}
  .sl label{color:var(--ink2);font-size:12px;display:flex;align-items:center;gap:5px}
  .sl label i{width:6px;height:6px;border-radius:50%;background:var(--lime);display:none}
  .sl.changed label i{display:inline-block}
  .sl.changed label{color:var(--ink)}
  .sl input{width:100%;accent-color:var(--dark)}
  .sl output{font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .note{color:var(--ink3);font-size:12px}
  textarea{width:100%;min-height:120px;margin-top:10px;font:12px/1.6 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;display:none}
  .grid{display:none;padding:0 24px 30px}
  .grid table{border-collapse:separate;border-spacing:10px 12px}
  .grid th{font-weight:500;font-size:12px;color:var(--ink2);text-align:center}
  .grid th.rowh{text-align:right;padding-right:4px}
  .cell{width:121px;height:262px;border-radius:14px;overflow:hidden;position:relative;background:#0B1A12;cursor:pointer;box-shadow:0 0 0 1px rgba(15,36,24,.2)}
  .cell iframe{border:0;width:402px;height:874px;transform:scale(.3);transform-origin:0 0;position:absolute;left:0;top:0;pointer-events:none}
  .cell:hover{box-shadow:0 0 0 2px var(--dark)}
  @media (max-width:900px){.wrap{flex-direction:column}}
</style>
</head>
<body>
<header>
  <h1>即時風景調校</h1>
  <p>內部用。拉滑桿會馬上套到手機上；手機下方的分頁可以點，切到字多的畫面看字體；數字也可以直接打，不受滑桿範圍限制；每一列右邊寫著原本的值，按一下就回去。調好之後按「複製設定」，貼給 Claude 就好。</p>
</header>
<div id="motionNote" style="display:none;margin:0 24px 12px;padding:10px 14px;border-radius:12px;background:#FFF6DC;border:1px solid #E8D79A;color:#5A4A12;font-size:12.5px;line-height:1.6"></div>
<div class="tabs">
  <button id="tabOne" class="on">單一畫面</button>
  <button id="tabAll">全部一次看</button>
</div>

<div class="wrap" id="one">
  <div class="phone" id="phone"><iframe id="frame" title="即時風景"></iframe></div>
  <div class="panel">
    <div class="row"><span class="lab">時段</span><div class="seg" id="todSeg"></div></div>
    <div class="row"><span class="lab">天氣</span><div class="seg" id="wxSeg"></div></div>
    <div class="row"><span class="lab">字體</span><div class="seg" id="fontSeg"></div></div>
    <div class="row"><span class="lab">聲音</span><div class="seg" id="sndSeg"></div><span class="note">瀏覽器擋聲音的話，點一下手機裡的「山上的聲音」</span></div>
    <div class="groups" id="groups"></div>
    <div class="actions">
      <button class="btn primary" id="copy">複製設定</button>
      <button class="btn" id="reset">全部回到原本</button>
      <span class="note" id="msg"></span>
    </div>
    <textarea id="out" readonly></textarea>
  </div>
</div>

<div class="grid" id="all"><table id="gridTable"></table></div>

<script>
(function(){
"use strict";
var TODS = [['晨','早上'],['午','中午'],['暮','傍晚'],['夜','晚上']];
var WXS  = [[null,'真實天氣'],['clear','晴'],['partly','晴時多雲'],['cloudy','陰'],['fog','霧'],['drizzle','毛毛雨'],['rain','雨'],['heavyrain','大雨'],['shower','陣雨'],['storm','雷雨'],['afterrain','雨剛停'],['snow','雪']];
var GROUPS = [
  {g:'星空（晴朗或多雲的晚上）', items:[['starCount','星星數量',40,300,10],['starSize','星星大小',0.5,2.5,0.05],['starBright','亮度',0.3,1.6,0.05],['twinkleSpeed','閃爍速度',0,3,0.05],['twinkleDepth','閃爍幅度',0,1.6,0.05]]},
  {g:'流星（只在晴朗的晚上）', items:[['meteorEvery','平均幾秒一顆',1.5,30,0.5],['meteorSpeed','速度',0.3,2.5,0.05],['meteorLength','尾巴長度',0.3,3,0.05]]},
  {g:'雲和霧', items:[['morphSpeed','形狀變化速度',0,4,0.05],['cloudAmount','雲的多寡',0.5,1.6,0.02],['cloudOpacity','雲的濃度',0,2.5,0.05],['cloudSpeed','雲飄的速度',0.2,4,0.05],['fog','霧的濃度',0,2.5,0.05],['fogSpeed','霧飄的速度',0.2,4,0.05],['dim','陰雨天變暗',0,2,0.05]]},
  {g:'雲的風格', look:'cloud', items:[['octaves','細節層數',1,5,1],['tones','明暗階數（1＝不分階）',1,5,1],['flat','壓扁成雲層',0.6,3,0.05],['edge','邊緣柔和度',0.03,0.3,0.01],['contrast','明暗對比',0,1.5,0.05]]},
  {g:'雨和雪', items:[['rainDensity','雨量',0.2,3,0.05],['rainSpeed','雨落下的速度',0.3,2.5,0.05],['rainSlant','雨的斜度',0,0.6,0.01],['snowDensity','雪量',0.2,3,0.05],['snowSpeed','雪落下的速度',0.3,3,0.05],['snowSway','雪左右飄',0,4,0.1]]},
  {g:'閃電（雷雨）', items:[['lightningEvery','平均幾秒閃一次',3,30,0.5],['flash','閃光亮度',0.2,2,0.05]]},
  {g:'山', items:[['peakHeight','遠山的高度',0.3,2,0.05],['haze','遠景的霧氣',0,2.5,0.05],['cloudSea','谷裡的雲海',0,2.5,0.05],['foreTree','左下角的大樹',0,1,0.05]]},
  {g:'樹', items:[['treeX','左右位置（%）',30,75,1],['treeBase','離底部（%）',15,40,0.5],['treeHeight','高度（%）',25,60,1],['treeDayOpacity','白天的濃度',0.3,1,0.02],['treeNightOpacity','晚上的亮度',0.2,1,0.02],['treeSway','擺動幅度（度）',0,3,0.1],['swaySpeed','擺一輪幾秒',4,30,1],['companions','旁邊的樹',0,3,0.05]]},
  {g:'主角的線條（發光的那棵樹，所有畫面都會變）', look:'main', items:[['lineRadius','線條加粗',0,3,0.05],['bodyAlpha','樹身底色',0,0.3,0.01],['bodyReach','樹身範圍',2,16,2]]},
  {g:'背景樹的線條（山上的剪影、左下角大樹、晨報小圖）', look:'bg', items:[['lineRadius','線條加粗',0,10,0.1],['bodyAlpha','樹身底色',0,1,0.05],['bodyReach','樹身範圍',2,24,2]]},
  {g:'聲音', items:[['volume','音量',0,1.5,0.05]]}
];

/* 目前的選擇與設定：存在這台電腦的瀏覽器裡，重新整理不會不見 */
var state = { tod:'夜', wx:'clear', sound:false, font:'goround' };
var tune = {}, look = {}, bglook = {}, cloudlook = {};
try{ Object.assign(state, JSON.parse(localStorage.getItem('th-lab-state') || '{}')); }catch(e){}
try{ tune = JSON.parse(localStorage.getItem('th-lab-tune') || '{}'); look = JSON.parse(localStorage.getItem('th-lab-look') || '{}'); bglook = JSON.parse(localStorage.getItem('th-lab-bglook') || '{}'); cloudlook = JSON.parse(localStorage.getItem('th-lab-cloudlook') || '{}'); }catch(e){}
function save(){ try{ localStorage.setItem('th-lab-state', JSON.stringify(state)); localStorage.setItem('th-lab-tune', JSON.stringify(tune)); localStorage.setItem('th-lab-look', JSON.stringify(look)); localStorage.setItem('th-lab-bglook', JSON.stringify(bglook)); localStorage.setItem('th-lab-cloudlook', JSON.stringify(cloudlook)); }catch(e){} }

var frame = document.getElementById('frame'), TH = null, DEF = null, LOOK_DEF = { lineRadius:0.9, bodyAlpha:0.08, bodyReach:8 }, BG_DEF = { lineRadius:4, bodyAlpha:0, bodyReach:8 }, CLOUD_DEF = { octaves:3, tones:3, flat:1.6, edge:0.1, contrast:0.6 };
/* 每一組的值存在哪、原本是多少：主角線條、背景樹線條、其他動畫參數各一份 */
function storeOf(G){ return G.look === 'main' ? look : G.look === 'bg' ? bglook : G.look === 'cloud' ? cloudlook : tune; }
function defOf(G, key){ return G.look === 'main' ? LOOK_DEF[key] : G.look === 'bg' ? BG_DEF[key] : G.look === 'cloud' ? CLOUD_DEF[key] : DEF[key]; }
/* motion=1：就算系統開了「減少動態效果」也照樣播動畫；v=時間：每次都拿最新版，不吃瀏覽器的舊快取 */
var BUST = Date.now();
function src(extra){ return '../share/?screen=7&mute=1&motion=1&v=' + BUST + (extra || ''); }

/* 把設定推進某個 iframe 裡的原型 */
function push(win, tod, wx, keepSound){
  var th = win && win.__TH; if(!th) return;
  Object.keys(th.DEFAULT).forEach(function(k){ th.TUNE[k] = (k in tune) ? tune[k] : th.DEFAULT[k]; });
  Object.keys(LOOK_DEF).forEach(function(k){ th.LOOK[k] = (k in look) ? look[k] : LOOK_DEF[k]; });
  if(th.BGLOOK) Object.keys(BG_DEF).forEach(function(k){ th.BGLOOK[k] = (k in bglook) ? bglook[k] : BG_DEF[k]; });
  if(th.CLOUD) Object.keys(CLOUD_DEF).forEach(function(k){ th.CLOUD[k] = (k in cloudlook) ? cloudlook[k] : CLOUD_DEF[k]; });
  if(!keepSound) th.mute(true);
  if(th.font && state.font) th.font(state.font);
  th.scene(tod, wx);
  th.apply();
}

/* ── 單一畫面 ── */
function fitPhone(){
  var sc = Math.min(1, (window.innerHeight - 110) / 874, 1);
  var ph = document.getElementById('phone');
  ph.style.width = (402*sc) + 'px'; ph.style.height = (874*sc) + 'px';
  frame.style.transform = 'scale(' + sc + ')';
}
fitPhone(); window.addEventListener('resize', fitPhone);
frame.addEventListener('load', function(){
  TH = frame.contentWindow.__TH; DEF = TH && TH.DEFAULT;
  if(!TH){ document.getElementById('msg').textContent = '原型還沒有調校介面，請重新整理'; return; }
  buildGroups();
  buildFonts();
  push(frame.contentWindow, state.tod, state.wx, true);
  TH.mute(!state.sound);
});
frame.src = src();

/* 字體按鈕：每個按鈕用它自己的字體顯示；點了就換手機裡的字，「全部一次看」也一起換 */
function buildFonts(){
  if(!TH || !TH.FONTS) return;
  var host = document.getElementById('fontSeg'); host.innerHTML = '';
  TH.FONTS.forEach(function(f){
    if(!document.querySelector('link[data-font="'+f.key+'"]')){
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.setAttribute('data-font', f.key);
      l.href = 'https://fonts.googleapis.com/css2?family=' + f.q + '&display=swap'; document.head.appendChild(l);
    }
    var b = document.createElement('button');
    b.textContent = f.name; b.title = f.note;
    b.style.fontFamily = (f.latin ? "'" + f.latin + "'," : '') + "'" + f.family + "',sans-serif";
    if(f.key === state.font) b.className = 'on';
    b.onclick = function(){
      state.font = f.key; save(); buildFonts();
      TH.font(f.key);
      Array.prototype.forEach.call(document.querySelectorAll('.cell iframe'), function(fr){ var th = fr.contentWindow && fr.contentWindow.__TH; if(th && th.font) th.font(f.key); });
    };
    host.appendChild(b);
  });
}
function seg(host, items, cur, onPick){
  host.innerHTML = '';
  items.forEach(function(it){
    var b = document.createElement('button');
    b.textContent = it[1]; if(it[0] === cur) b.className = 'on';
    b.onclick = function(){ onPick(it[0]); };
    host.appendChild(b);
  });
}
function renderSegs(){
  seg(document.getElementById('todSeg'), TODS, state.tod, function(v){ state.tod = v; save(); renderSegs(); TH && TH.scene(state.tod, state.wx); });
  seg(document.getElementById('wxSeg'), WXS, state.wx, function(v){ state.wx = v; save(); renderSegs(); TH && TH.scene(state.tod, state.wx); });
  seg(document.getElementById('sndSeg'), [[false,'靜音'],[true,'播放']], state.sound, function(v){ state.sound = v; save(); renderSegs(); TH && TH.mute(!v); });
}
renderSegs();
/* 系統開了「減少動態效果」時，原型平常會停掉動畫；這裡提醒一下，調校頁本身已經強制打開 */
if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  var mn = document.getElementById('motionNote'); mn.style.display = 'block';
  mn.textContent = '你的電腦開了「減少動態效果」（系統設定 → 輔助使用 → 顯示器）。原型平常會因此停掉所有動畫；這個調校頁已經強制打開動畫，但分享版在你的裝置上仍會是靜止的。';
}

var timer = null;
function applySoon(){ clearTimeout(timer); timer = setTimeout(function(){ push(frame.contentWindow, state.tod, state.wx, true); TH.mute(!state.sound); }, 120); }

function fmt(v, step){ return step >= 1 ? String(Math.round(v)) : (+v).toFixed(step < 0.1 ? 2 : 1); }
/* 數字可以自由打，只擋掉會讓畫面壞掉的值：不能小於這些（左右位置可以是負的）；這幾個要整數 */
var FLOOR = { starCount:0, starSize:0, starBright:0, twinkleSpeed:0, twinkleDepth:0,
  meteorEvery:0.2, meteorSpeed:0.05, meteorLength:0, cloudOpacity:0, cloudSpeed:0.05, fog:0, fogSpeed:0.05, dim:0,
  rainDensity:0, rainSpeed:0.05, rainSlant:0, snowDensity:0, snowSpeed:0.05, snowSway:0,
  lightningEvery:0.5, flash:0, treeHeight:1, treeNightOpacity:0, treeSway:0, swaySpeed:0.5, companions:0,
  lineRadius:0, bodyAlpha:0, bodyReach:0, volume:0, peakHeight:0, haze:0, cloudSea:0, foreTree:0, treeBase:5, treeDayOpacity:0, cloudAmount:0.3, morphSpeed:0, octaves:1, tones:1, flat:0.3, edge:0.02, contrast:0 };
var INT = { starCount:true, bodyReach:true, octaves:true, tones:true };
function buildGroups(){
  var host = document.getElementById('groups'); host.innerHTML = '';
  GROUPS.forEach(function(G){
    var box = document.createElement('div'); box.className = 'group';
    var h = document.createElement('h3'); h.appendChild(document.createTextNode(G.g));
    var gr = document.createElement('button'); gr.textContent = '重設這組';
    gr.onclick = function(){ G.items.forEach(function(it){ delete storeOf(G)[it[0]]; }); save(); buildGroups(); applySoon(); };
    h.appendChild(gr); box.appendChild(h);
    G.items.forEach(function(it){
      var key = it[0], store = storeOf(G), def = defOf(G, key);
      var row = document.createElement('div'); row.className = 'sl';
      var lab = document.createElement('label'); lab.innerHTML = '<i></i>'; lab.appendChild(document.createTextNode(it[1]));
      var val = (key in store) ? store[key] : def;   /* 真正的值，可以超出滑桿的範圍 */
      var inp = document.createElement('input'); inp.type = 'range'; inp.step = 'any';
      /* 滑桿上方的小刻度：原本的值在哪裡 */
      var track = document.createElement('div'); track.className = 'track';
      var tick = document.createElement('span'); tick.className = 'def';
      tick.title = '原本 ' + fmt(def, it[4]);
      track.appendChild(tick); track.appendChild(inp);
      /* 數字可以直接打：打完按 Enter 或點別的地方就套用 */
      var num = document.createElement('input'); num.type = 'number'; num.className = 'num'; num.step = it[4];
      var rs = document.createElement('button'); rs.className = 'rs';
      var lo = it[2], hi = it[3];
      var fit = function(){
        /* 打的數字超出範圍，滑桿就跟著放大範圍 */
        lo = Math.min(it[2], val, def); hi = Math.max(it[3], val, def);
        inp.min = lo; inp.max = hi;
        tick.style.left = (((def - lo) / (hi - lo)) * 100) + '%';
      };
      var mark = function(){
        var ch = Math.abs(val - def) > 1e-9;
        row.classList.toggle('changed', ch);
        rs.textContent = (ch ? '↺ ' : '') + '原本 ' + fmt(def, it[4]);
        rs.title = ch ? '回到原本的 ' + fmt(def, it[4]) : '目前就是原本的值';
      };
      var setVal = function(v, from){
        if(isNaN(v)) v = val;
        if(FLOOR[key] !== undefined && v < FLOOR[key]) v = FLOOR[key];
        if(INT[key]) v = Math.round(v);
        val = v;
        if(Math.abs(v - def) < 1e-9) delete store[key]; else store[key] = v;
        fit();
        if(from !== 'range') inp.value = v;
        if(from !== 'num' || document.activeElement !== num) num.value = +(+v).toFixed(4);
        mark(); save(); applySoon();
      };
      inp.oninput = function(){
        /* 拉滑桿時照每一列的刻度取整 */
        var st = it[4], v = Math.round(+inp.value / st) * st;
        setVal(+v.toFixed(4), 'range');
      };
      num.onchange = function(){ setVal(parseFloat(num.value), 'numDone'); };
      num.onkeydown = function(e){ if(e.key === 'Enter'){ num.blur(); } };
      rs.onclick = function(){ if(row.classList.contains('changed')) setVal(def); };
      fit(); inp.value = val; num.value = +(+val).toFixed(4); mark();
      var out = num;
      row.appendChild(lab); row.appendChild(track); row.appendChild(out); row.appendChild(rs);
      box.appendChild(row);
    });
    host.appendChild(box);
  });
}

document.getElementById('reset').onclick = function(){
  tune = {}; look = {}; bglook = {}; cloudlook = {}; save(); buildGroups(); applySoon();
  document.getElementById('msg').textContent = '已經回到原本的設定';
};
document.getElementById('copy').onclick = function(){
  var lines = [];
  GROUPS.forEach(function(G){
    G.items.forEach(function(it){
      var store = storeOf(G), def = defOf(G, it[0]);
      if(it[0] in store) lines.push(G.g.replace(/（.*）/, '') + '／' + it[1] + '：' + (+store[it[0]].toFixed(4)) + '（原本 ' + fmt(def, it[4]) + '）  ' + (G.look === 'bg' ? 'BG_LOOK.' : G.look === 'main' ? 'TREE_LOOK.' : G.look === 'cloud' ? 'CLOUD_STYLE.' : '') + it[0] + '=' + store[it[0]]);
    });
  });
  var text = lines.length ? ('即時風景調校設定\n' + lines.join('\n')) : '即時風景調校設定：沒有改動';
  var ta = document.getElementById('out'); ta.value = text; ta.style.display = 'block';
  var msg = document.getElementById('msg');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ msg.textContent = '已複製，貼給 Claude 就好'; }, function(){ ta.select(); msg.textContent = '請手動複製下面的文字'; });
  else { ta.select(); msg.textContent = '請手動複製下面的文字'; }
};

/* ── 28 種一次看：4 個時段 × 7 種天氣 ── */
var gridBuilt = false;
function buildGrid(){
  var t = document.getElementById('gridTable'); t.innerHTML = '';
  var hr = document.createElement('tr'); hr.appendChild(document.createElement('th'));
  WXS.slice(1).forEach(function(w){ var th = document.createElement('th'); th.textContent = w[1]; hr.appendChild(th); });
  t.appendChild(hr);
  TODS.forEach(function(td){
    var tr = document.createElement('tr');
    var th = document.createElement('th'); th.className = 'rowh'; th.textContent = td[1]; tr.appendChild(th);
    WXS.slice(1).forEach(function(w){
      var tdc = document.createElement('td');
      var cell = document.createElement('div'); cell.className = 'cell'; cell.title = td[1] + '・' + w[1] + '（點一下放大調整）';
      var f = document.createElement('iframe'); f.loading = 'lazy'; f.setAttribute('tabindex', '-1');
      f.addEventListener('load', function(){ push(f.contentWindow, td[0], w[0], false); });
      f.src = src('&nofetch=1&hour=' + {'晨':7,'午':13,'暮':17,'夜':22}[td[0]] + '&wx=' + w[0]);
      cell.appendChild(f);
      cell.onclick = function(){ state.tod = td[0]; state.wx = w[0]; save(); renderSegs(); TH && TH.scene(state.tod, state.wx); show('one'); };
      tdc.appendChild(cell); tr.appendChild(tdc);
    });
    t.appendChild(tr);
  });
  gridBuilt = true;
}
function refreshGrid(){
  Array.prototype.forEach.call(document.querySelectorAll('.cell iframe'), function(f, i){
    var nW = WXS.length - 1, td = TODS[Math.floor(i / nW)][0], w = WXS[1 + i % nW][0];
    push(f.contentWindow, td, w, false);
  });
}
function show(which){
  document.getElementById('one').style.display = which === 'one' ? '' : 'none';
  document.getElementById('all').style.display = which === 'all' ? 'block' : 'none';
  document.getElementById('tabOne').className = which === 'one' ? 'on' : '';
  document.getElementById('tabAll').className = which === 'all' ? 'on' : '';
  if(which === 'all'){
    TH && TH.mute(true);
    if(!gridBuilt) buildGrid(); else refreshGrid();
  } else if(TH){ TH.mute(!state.sound); }
}
document.getElementById('tabOne').onclick = function(){ show('one'); };
document.getElementById('tabAll').onclick = function(){ show('all'); };
})();
</script>
